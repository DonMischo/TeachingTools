services:

  postgres:
    image: postgres:17-alpine
    container_name: hauspokal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hauspokal
      # Zufällig je Installation (install.sh / install.bat); ältere Installationen behalten den Standard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hauspokal}
      POSTGRES_DB: hauspokal
    ports:
      - "127.0.0.1:${DB_PORT:-5435}:5432"
    volumes:
      - hauspokal-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hauspokal"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    container_name: hauspokal-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://hauspokal:${POSTGRES_PASSWORD:-hauspokal}@postgres:5432/hauspokal
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      # Nur beim Schlüsselwechsel: der bisherige Schlüssel (gespeicherte Passwörter werden umgeschlüsselt)
      SECRET_KEY_ALT: ${SECRET_KEY_ALT:-}
    volumes:
      - ./api:/workspace/api
      - ./data:/workspace/data
      # Feature-Liste für »Was kann TT?« (/api/ueberblick)
      - ./features.yml:/workspace/features.yml:ro
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    container_name: hauspokal-frontend
    restart: unless-stopped
    environment:
      PORT: ${APP_PORT:-1339}
      NEXT_PORT: 3000
      NEXT_SKIP_TYPECHECK: ${NEXT_SKIP_TYPECHECK:-1}
      API_HOST: api
      API_PORT: 8000
      HOST_IP: ${HOST_IP:-}
    ports:
      - "${APP_PORT:-1339}:${APP_PORT:-1339}"
    volumes:
      - ./frontend:/app
      - frontend-nm:/app/node_modules
      - frontend-next:/app/.next
    depends_on:
      - api

volumes:
  hauspokal-pg-data:
  frontend-nm:
  frontend-next:
