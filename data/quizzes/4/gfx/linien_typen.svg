<svg viewBox="0 0 400 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="240" fill="#1e293b" rx="12"/>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e2e8f0"/>
    </marker>
    <marker id="al" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e2e8f0"/>
    </marker>
  </defs>

  <!-- Row 1: Gerade -->
  <text x="20" y="48" fill="#94a3b8" font-size="12" font-family="sans-serif">Gerade g</text>
  <line x1="115" y1="55" x2="380" y2="55" stroke="#e2e8f0" stroke-width="2.5"
        marker-start="url(#al)" marker-end="url(#ar)"/>
  <line x1="20" y1="55" x2="113" y2="55" stroke="#e2e8f0" stroke-width="2.5"/>

  <line x1="16" y1="78" x2="384" y2="78" stroke="#334155" stroke-width="1"/>

  <!-- Row 2: Strahl -->
  <text x="20" y="103" fill="#94a3b8" font-size="12" font-family="sans-serif">Strahl s</text>
  <circle cx="115" cy="110" r="5" fill="#f87171"/>
  <line x1="115" y1="110" x2="375" y2="110" stroke="#e2e8f0" stroke-width="2.5" marker-end="url(#ar)"/>

  <line x1="16" y1="133" x2="384" y2="133" stroke="#334155" stroke-width="1"/>

  <!-- Row 3: Strecke -->
  <text x="20" y="158" fill="#94a3b8" font-size="12" font-family="sans-serif">Strecke AB</text>
  <circle cx="115" cy="165" r="5" fill="#f87171"/>
  <line x1="115" y1="165" x2="340" y2="165" stroke="#e2e8f0" stroke-width="2.5"/>
  <circle cx="340" cy="165" r="5" fill="#f87171"/>
  <text x="115" y="186" text-anchor="middle" fill="#fbbf24" font-size="12" font-family="sans-serif" font-style="italic">A</text>
  <text x="340" y="186" text-anchor="middle" fill="#fbbf24" font-size="12" font-family="sans-serif" font-style="italic">B</text>

  <text x="200" y="218" text-anchor="middle" fill="#475569" font-size="11" font-family="sans-serif">Welche haben keinen Endpunkt?</text>
</svg>
