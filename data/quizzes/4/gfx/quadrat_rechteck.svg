  <!-- Rectangle (right) -->
  <rect x="225" y="65" width="145" height="90" fill="#1e3a5f" stroke="#60a5fa" stroke-width="2.5"/>
  <path d="M225,65 L225,81 L241,81" fill="none" stroke="#4ade80" stroke-width="1.8"/>
  <path d="M370,65 L354,65 L354,81" fill="none" stroke="#4ade80" stroke-width="1.8"/>
  <path d="M225,155 L225,139 L241,139" fill="none" stroke="#4ade80" stroke-width="1.8"/>
  <path d="M370,155 L354,155 L354,139" fill="none" stroke="#4ade80" stroke-width="1.8"/>
  <!-- double ticks on long sides -->
  <line x1="291" y1="65" x2="299" y2="65" stroke="#60a5fa" stroke-width="2"/>
  <line x1="291" y1="155" x2="299" y2="155" stroke="#60a5fa" stroke-width="2"/>
  <line x1="225" y1="108" x2="225" y2="116" stroke="#60a5fa" stroke-width="2"/>
  <line x1="225" y1="100" x2="225" y2="108" stroke="#60a5fa" stroke-width="2"/>
  <line x1="370" y1="108" x2="370" y2="116" stroke="#60a5fa" stroke-width="2"/>
  <line x1="370" y1="100" x2="370" y2="108" stroke="#60a5fa" stroke-width="2"/>
  <text x="297" y="190" text-anchor="middle" fill="#60a5fa" font-size="13" font-family="sans-serif">Rechteck</text>
