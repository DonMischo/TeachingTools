<svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="200" fill="#1e293b" rx="12"/>

  <!-- Square (left) -->
  <rect x="40" y="50" width="120" height="120" fill="#2d1f5e" stroke="#a78bfa" stroke-width="2.5"/>
  <path d="M40,50 L40,66 L56,66" fill="none" stroke="#4ade80" stroke-width="1.8"/>
  <path d="M160,50 L144,50 L144,66" fill="none" stroke="#4ade80" stroke-width="1.8"/>
  <path d="M40,170 L40,154 L56,154" fill="none" stroke="#4ade80" stroke-width="1.8"/>
  <path d="M160,170 L144,170 L144,154" fill="none" stroke="#4ade80" stroke-width="1.8"/>
  <!-- tick marks showing equal sides -->
  <line x1="94" y1="50" x2="106" y2="50" stroke="#a78bfa" stroke-width="2"/>
  <line x1="94" y1="170" x2="106" y2="170" stroke="#a78bfa" stroke-width="2"/>
  <line x1="40" y1="104" x2="40" y2="116" stroke="#a78bfa" stroke-width="2"/>
