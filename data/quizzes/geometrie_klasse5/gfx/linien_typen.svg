<svg viewBox="0 0 400 220" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="220" fill="#1e293b" rx="12"/>

  <!-- Row 1: Gerade — arrows on both ends -->
  <text x="200" y="40" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="sans-serif">Gerade g</text>
  <line x1="25" y1="55" x2="375" y2="55" stroke="#e2e8f0" stroke-width="2.5"/>
  <polygon points="25,51 17,55 25,59" fill="#e2e8f0"/>
  <polygon points="375,51 383,55 375,59" fill="#e2e8f0"/>

  <line x1="16" y1="78" x2="384" y2="78" stroke="#334155" stroke-width="1"/>

  <!-- Row 2: Strahl — x marker at start, arrow at end -->
  <text x="20" y="103" fill="#94a3b8" font-size="12" font-family="sans-serif">Strahl s</text>
  <line x1="115" y1="110" x2="367" y2="110" stroke="#e2e8f0" stroke-width="2.5"/>
  <polygon points="367,106 375,110 367,114" fill="#e2e8f0"/>
  <line x1="109" y1="104" x2="121" y2="116" stroke="#f87171" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="121" y1="104" x2="109" y2="116" stroke="#f87171" stroke-width="2.5" stroke-linecap="round"/>

  <line x1="16" y1="133" x2="384" y2="133" stroke="#334155" stroke-width="1"/>

  <!-- Row 3: Strecke — x markers at both ends -->
  <text x="20" y="158" fill="#94a3b8" font-size="12" font-family="sans-serif">Strecke AB</text>
  <line x1="115" y1="165" x2="340" y2="165" stroke="#e2e8f0" stroke-width="2.5"/>
  <line x1="109" y1="159" x2="121" y2="171" stroke="#f87171" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="121" y1="159" x2="109" y2="171" stroke="#f87171" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="334" y1="159" x2="346" y2="171" stroke="#f87171" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="346" y1="159" x2="334" y2="171" stroke="#f87171" stroke-width="2.5" stroke-linecap="round"/>
  <text x="115" y="186" text-anchor="middle" fill="#fbbf24" font-size="12" font-family="sans-serif" font-style="italic">A</text>
  <text x="340" y="186" text-anchor="middle" fill="#fbbf24" font-size="12" font-family="sans-serif" font-style="italic">B</text>
</svg>
