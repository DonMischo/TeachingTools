<svg viewBox="0 0 400 180" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="180" fill="#1e293b" rx="12"/>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e2e8f0"/>
    </marker>
    <marker id="al" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e2e8f0"/>
    </marker>
  </defs>

  <!-- Line g -->
  <line x1="28" y1="65" x2="355" y2="65" stroke="#60a5fa" stroke-width="2.5"
        marker-start="url(#al)" marker-end="url(#ar)"/>
  <text x="370" y="70" fill="#60a5fa" font-size="14" font-family="sans-serif" font-style="italic">g</text>

  <!-- distance arrows -->
  <line x1="200" y1="70" x2="200" y2="110" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Line h -->
  <line x1="28" y1="115" x2="355" y2="115" stroke="#e2e8f0" stroke-width="2.5"
        marker-start="url(#al)" marker-end="url(#ar)"/>
  <text x="370" y="120" fill="#e2e8f0" font-size="14" font-family="sans-serif" font-style="italic">h</text>

  <text x="200" y="160" text-anchor="middle" fill="#64748b" font-size="12" font-family="sans-serif">g ∥ h — gleicher Abstand, schneiden sich nie</text>
</svg>
