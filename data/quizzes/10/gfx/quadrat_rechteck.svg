<svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="200" fill="#1e293b" rx="12"/>

  <!-- Square (left): x=40 y=50 w=120 h=120 -->
  <rect x="40" y="50" width="120" height="120" fill="#2d1f5e" stroke="#a78bfa" stroke-width="2.5"/>
  <path d="M40,65 L55,65 L55,50" fill="none" stroke="#4ade80" stroke-width="1.8"/>
  <path d="M160,65 L145,65 L145,50" fill="none" stroke="#4ade80" stroke-width="1.8"/>
  <path d="M40,155 L55,155 L55,170" fill="none" stroke="#4ade80" stroke-width="1.8"/>
  <path d="M160,155 L145,155 L145,170" fill="none" stroke="#4ade80" stroke-width="1.8"/>
  <!-- equal-side tick marks -->
  <line x1="94" y1="50" x2="106" y2="50" stroke="#a78bfa" stroke-width="2"/>
  <line x1="94" y1="170" x2="106" y2="170" stroke="#a78bfa" stroke-width="2"/>
  <line x1="40" y1="104" x2="40" y2="116" stroke="#a78bfa" stroke-width="2"/>
  <line x1="160" y1="104" x2="160" y2="116" stroke="#a78bfa" stroke-width="2"/>
  <text x="100" y="190" text-anchor="middle" fill="#a78bfa" font-size="13" font-family="sans-serif">Quadrat</text>

  <!-- Divider -->
  <line x1="205" y1="40" x2="205" y2="175" stroke="#334155" stroke-width="1"/>

  <!-- Rectangle (right): x=225 y=65 w=145 h=90 -->
  <rect x="225" y="65" width="145" height="90" fill="#1e3a5f" stroke="#60a5fa" stroke-width="2.5"/>
  <path d="M225,80 L240,80 L240,65" fill="none" stroke="#4ade80" stroke-width="1.8"/>
  <path d="M370,80 L355,80 L355,65" fill="none" stroke="#4ade80" stroke-width="1.8"/>
  <path d="M225,140 L240,140 L240,155" fill="none" stroke="#4ade80" stroke-width="1.8"/>
  <path d="M370,140 L355,140 L355,155" fill="none" stroke="#4ade80" stroke-width="1.8"/>
  <!-- double ticks on long sides -->
  <line x1="291" y1="65" x2="299" y2="65" stroke="#60a5fa" stroke-width="2"/>
  <line x1="291" y1="155" x2="299" y2="155" stroke="#60a5fa" stroke-width="2"/>
  <line x1="225" y1="108" x2="225" y2="116" stroke="#60a5fa" stroke-width="2"/>
  <line x1="225" y1="100" x2="225" y2="108" stroke="#60a5fa" stroke-width="2"/>
  <line x1="370" y1="108" x2="370" y2="116" stroke="#60a5fa" stroke-width="2"/>
  <line x1="370" y1="100" x2="370" y2="108" stroke="#60a5fa" stroke-width="2"/>
  <text x="297" y="190" text-anchor="middle" fill="#60a5fa" font-size="13" font-family="sans-serif">Rechteck</text>
</svg>
