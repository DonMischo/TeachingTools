  <line x1="219" y1="96" x2="226" y2="89" stroke="#F6B40E" stroke-width="5" stroke-linecap="round"/>
  <line x1="181" y1="134" x2="174" y2="141" stroke="#F6B40E" stroke-width="5" stroke-linecap="round"/>
  <line x1="219" y1="134" x2="226" y2="141" stroke="#F6B40E" stroke-width="5" stroke-linecap="round"/>
