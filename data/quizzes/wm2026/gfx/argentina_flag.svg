  <line x1="224" y1="103" x2="232" y2="98" stroke="#F6B40E" stroke-width="3" stroke-linecap="round"/>
  <line x1="176" y1="127" x2="168" y2="132" stroke="#F6B40E" stroke-width="3" stroke-linecap="round"/>
