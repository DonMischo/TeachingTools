  quellen: [q_freeman2014, q_chi2014]

- id: d_sandwich
  name: Sandwich-Prinzip
  aliase: [Wechsel von kollektiven und individuellen Lernphasen]
  kategorie: didaktik
  phasen: [uebergreifend, hauptteil]
  setting: [plenum, einzel, kleingruppe]
  zielgruppen: [jugendliche, erwachsene]
  anwendung: [wissensaufbau, reflexion]
  dauer: Planungsprinzip
  kurz: Phasen gemeinsamer Informationsaufnahme (Vortrag, Video) wechseln regelmäßig mit kurzen individuellen Verarbeitungsphasen (Notieren, Erklären, Anwenden). Der »Belag« ist die Verarbeitung.
  ablauf:
    - Input in Häppchen von ca. 10–20 Min. gliedern.
    - Dazwischen 3–10 Min. Verarbeitung (Think-Pair-Share, Lückentext, Frage formulieren).
    - Mit einer persönlichen Anwendungsplanung schließen.
  varianten:
    - "Jugendliche: Input von 15 Minuten, dann Notieren in Stichworten, dann Plenum."
    - "Erwachsene: Vortrag im Workshop mit kurzer Partnerphase nach jedem Block."
    - "Digital: Videoinput mit Chat-Aufgabe zwischen den Abschnitten."
  stolpersteine:
    - "Die Verarbeitungsphasen werden gestrichen, wenn es eng wird; sie als festen Bestandteil planen."
    - "Nach dem letzten Block fehlt die Anwendung; mit persönlichem Plan abschließen."
  evidenz: {stufe: mittel, text: "Von Diethelm Wahl für Erwachsenenbildung und Hochschule beschrieben; konsistent mit ICAP (Chi & Wylie 2014) und den Befunden zu aktivem Lernen."}
  qualifikation: alle
  quellen: [q_wahl2013, q_chi2014]

- id: d_denkhuete
  name: Sechs Denkhüte
  aliase: [Six Thinking Hats, Perspektivwechsel nach de Bono]
  kategorie: didaktik
  phasen: [hauptteil]
  setting: [kleingruppe, plenum]
  zielgruppen: [jugendliche, erwachsene]
  anwendung: [kreativitaet, entscheidung, diskussion]
  dauer: 30–60 Min.
  kurz: "Ein Thema wird nacheinander aus sechs Denkrichtungen betrachtet: weiß (Fakten), rot (Gefühle), schwarz (Risiken), gelb (Chancen), grün (neue Ideen), blau (Steuerung des Prozesses)."
  ablauf:
    - Frage klären; blauer Hut legt Reihenfolge fest.
    - Alle »tragen« gleichzeitig denselben Hut (paralleles Denken), je 3–5 Min.
    - Ergebnisse pro Hut festhalten.
    - Blauer Hut fasst zusammen und leitet Entscheidung ab.
  varianten:
    - "Jugendliche: sechs Hüte mit Farbkarten für eine Schulfrage, Ergebnisse je Hut notieren."
    - "Erwachsene: Sechs-Hüte-Runde für Teamentscheidungen mit klarer Moderation."
    - "Digital: sechs Abschnitte im Dokument, jede Gruppe füllt einen Hut aus."
  stolpersteine:
    - Als Rollenzuweisung an Einzelne (»Du bist der Schwarze«) verliert die Methode ihren Kern.
  evidenz: {stufe: praxis, text: "Populäre Kreativitäts- und Entscheidungstechnik (de Bono 1985); kaum kontrollierte Studien. Nützlich als Struktur, um Kritik und Ideen zeitlich zu trennen."}
  qualifikation: alle
  quellen: [q_debono1985]

- id: d_pecha_kucha
  name: Pecha Kucha / Kurzvortrag mit festem Takt
  aliase: [20×20-Präsentation, Ignite-Talk, Lightning Talk]
  kategorie: didaktik
  phasen: [hauptteil, abschluss]
  setting: [einzel, plenum]
  zielgruppen: [jugendliche, erwachsene]
  anwendung: [lesen_schreiben, verstehen, reflexion]
  dauer: 6:40 Min. pro Vortrag
  kurz: 20 Folien, jede automatisch 20 Sekunden lang – das Format zwingt zu Verdichtung, Bildsprache und Übung.
  ablauf:
    - Kernaussage festlegen, Storyboard mit 20 Bildern.
    - Folien mit automatischem Wechsel einrichten.
    - Mehrfach mit Zeit üben.
    - Vortrag, danach kurze Fragerunde und Peer-Feedback.
  varianten:
    - "Jugendliche: 10 Folien mit je 20 Sekunden für ein Referat."
    - "Erwachsene: 20 Folien zu einem Projekt, Feedback im Team."
    - "Digital: Vortrag als Video mit festem Folienwechsel aufnehmen."
  stolpersteine:
    - Für jüngere Lernende Folienzahl reduzieren (z. B. 10 × 20 Sek.).
  evidenz: {stufe: praxis, text: "In Hochschullehre und Konferenzen verbreitetes Präsentationsformat; kaum Wirksamkeitsforschung; die Verdichtung ist eine generative Lernaktivität."}
  qualifikation: alle
  quellen: [q_pecha, q_fiorella2016]
