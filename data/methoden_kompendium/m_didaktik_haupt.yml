    - "Digital: Austausch in Breakout-Räumen von zwei Minuten, danach Kurzbericht."
  stolpersteine:
    - "Die Murmelphase wird zu lang und kippt in Privatgespräche; Zeit und Frage klar begrenzen."
    - "Nur wenige Ergebnisse werden eingesammelt; wenige Gruppen gezielt berichten lassen."
  evidenz: {stufe: mittel, text: "Teil aktiver Lernformen in Großveranstaltungen; Freeman et al. (2014) belegen Vorteile aktiven Lernens gegenüber reinem Vortrag."}
