<rect x="0" y="0" width="960" height="600" fill="#0F1E2E" rx="12"/>
<text x="480.0" y="38.0" font-size="20" fill="#FFFFFF" text-anchor="middle" font-weight="bold">KOOPERATIVE GRUNDSTRUKTUREN</text>
<line x1="60" y1="50" x2="900" y2="50" stroke="#C9A227" stroke-width="2"/>
<text x="480.0" y="70.0" font-size="12" fill="#8AADCC" text-anchor="middle" font-weight="normal">Erst allein denken, dann austauschen – und jede Person ist für das Ergebnis verantwortlich</text>
<text x="40" y="104.0" font-size="13" fill="#C9A227" text-anchor="start" font-weight="bold">ICH – DU – WIR (THINK – PAIR – SHARE)</text>
<rect x="40" y="118" width="260" height="70" fill="#3D7DCA" rx="8"/>
<text x="56" y="146.0" font-size="20" fill="#FFFFFF" text-anchor="start" font-weight="bold">ICH</text>
<text x="120" y="142.0" font-size="12" fill="#FFFFFF" text-anchor="start" font-weight="normal">allein denken und notieren</text>
<text x="120" y="176.0" font-size="10.5" fill="#FFFFFF" text-anchor="start" font-weight="normal">1–5 Min.</text>
<path d="M304 153 l18 0 m-7 -7 l7 7 l-7 7" stroke="#C9A227" stroke-width="2.5" fill="none"/>
