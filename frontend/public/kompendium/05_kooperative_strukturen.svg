<text x="720" y="142.0" font-size="12" fill="#FFFFFF" text-anchor="start" font-weight="normal">Zufallsauswahl stellt vor</text>
<text x="720" y="176.0" font-size="10.5" fill="#FFFFFF" text-anchor="start" font-weight="normal">5–10 Min.</text>
