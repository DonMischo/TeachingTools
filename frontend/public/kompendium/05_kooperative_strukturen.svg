<text x="420" y="142.0" font-size="12" fill="#FFFFFF" text-anchor="start" font-weight="normal">zu zweit vergleichen,</text>
<text x="420" y="157.6" font-size="12" fill="#FFFFFF" text-anchor="start" font-weight="normal">verbessern</text>
<text x="420" y="176.0" font-size="10.5" fill="#FFFFFF" text-anchor="start" font-weight="normal">2–5 Min.</text>
<path d="M604 153 l18 0 m-7 -7 l7 7 l-7 7" stroke="#C9A227" stroke-width="2.5" fill="none"/>
