<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="PRÄVENTIONSSTUFEN UND ROLLEN">
<rect x="0" y="0" width="960" height="560" fill="#0F1E2E" rx="12"/>
<text x="480.0" y="38.0" font-size="20" fill="#FFFFFF" text-anchor="middle" font-weight="bold">PRÄVENTIONSSTUFEN UND ROLLEN</text>
<line x1="60" y1="50" x2="900" y2="50" stroke="#C9A227" stroke-width="2"/>
<text x="480.0" y="70.0" font-size="12" fill="#8AADCC" text-anchor="middle" font-weight="normal">Wer welche psychologischen Methoden einsetzen sollte</text>
<rect x="200.0" y="96" width="200" height="110" fill="#B03A2E" rx="6"/>
<text x="300" y="142.0" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="bold">INDIZIERT</text>
<text x="300" y="164.0" font-size="11.5" fill="#FFFFFF" text-anchor="middle" font-weight="normal">Personen mit ersten Symptomen</text>
<rect x="560" y="96" width="370" height="110" fill="#1A2A3A" rx="6"/>
<text x="576" y="120.0" font-size="11" fill="#B03A2E" text-anchor="start" font-weight="bold">QUALIFIKATION: psychologische/therapeutische Fachkraft</text>
<text x="576" y="150.0" font-size="11.5" fill="#E0E8F0" text-anchor="start" font-weight="normal">Kognitive Umstrukturierung · DBT-Skills ·</text>
<text x="576" y="164.9" font-size="11.5" fill="#E0E8F0" text-anchor="start" font-weight="normal">Verhaltensaktivierung · Angstprogramme (gezielt)</text>
<rect x="135.0" y="218" width="330" height="110" fill="#B8860B" rx="6"/>
<text x="300" y="264.0" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="bold">SELEKTIV</text>
<text x="300" y="286.0" font-size="11.5" fill="#FFFFFF" text-anchor="middle" font-weight="normal">Gruppen mit erhöhtem Risiko</text>
<rect x="560" y="218" width="370" height="110" fill="#1A2A3A" rx="6"/>
<text x="576" y="242.0" font-size="11" fill="#B8860B" text-anchor="start" font-weight="bold">QUALIFIKATION: mit Schulung/Manual</text>
<text x="576" y="272.0" font-size="11.5" fill="#E0E8F0" text-anchor="start" font-weight="normal">Soziales Kompetenztraining · Daily Report Card ·</text>
<text x="576" y="286.9" font-size="11.5" fill="#E0E8F0" text-anchor="start" font-weight="normal">Mentoring · No Blame Approach</text>
<rect x="70.0" y="340" width="460" height="110" fill="#2E9466" rx="6"/>
<text x="300" y="386.0" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="bold">UNIVERSELL</text>
<text x="300" y="408.0" font-size="11.5" fill="#FFFFFF" text-anchor="middle" font-weight="normal">Alle Lernenden einer Gruppe</text>
<rect x="560" y="340" width="370" height="110" fill="#1A2A3A" rx="6"/>
<text x="576" y="364.0" font-size="11" fill="#5CC593" text-anchor="start" font-weight="bold">QUALIFIKATION: jede Lehr-/Leitungsperson</text>
<text x="576" y="394.0" font-size="11.5" fill="#E0E8F0" text-anchor="start" font-weight="normal">Klassenführung · SEL-Unterricht · Atemübung ·</text>
<text x="576" y="408.9" font-size="11.5" fill="#E0E8F0" text-anchor="start" font-weight="normal">Gefühls-Check-in · Begrüßung an der Tür</text>
<text x="480.0" y="486.0" font-size="12.5" fill="#C9A227" text-anchor="middle" font-weight="normal" font-style="italic">Lehrkräfte erkennen, unterstützen und vermitteln – Diagnostik und Behandlung gehören in Fachhände.</text>
<text x="480.0" y="510.0" font-size="11" fill="#E0E8F0" text-anchor="middle" font-weight="normal">Bei Selbst- oder Fremdgefährdung, Gewalt oder Kindeswohlgefährdung: sofort Schulleitung, Schulpsychologie, Krisendienst einbeziehen.</text>
<text x="480.0" y="540.0" font-size="10.5" fill="#8AADCC" text-anchor="middle" font-weight="normal">Quellen: Mrazek &amp; Haggerty 1994 (IOM-Präventionsmodell) · WHO 2011</text>
</svg>
