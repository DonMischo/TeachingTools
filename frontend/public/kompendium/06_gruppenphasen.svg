<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="GRUPPENPHASEN UND LEITUNGSVERHALTEN">
<rect x="0" y="0" width="960" height="520" fill="#0F1E2E" rx="12"/>
<text x="480.0" y="38.0" font-size="20" fill="#FFFFFF" text-anchor="middle" font-weight="bold">GRUPPENPHASEN UND LEITUNGSVERHALTEN</text>
<line x1="60" y1="50" x2="900" y2="50" stroke="#C9A227" stroke-width="2"/>
<text x="480.0" y="70.0" font-size="12" fill="#8AADCC" text-anchor="middle" font-weight="normal">Was in Gruppen typischerweise passiert – und was die Leitung in jeder Phase tun kann</text>
<path d="M80 210 L250 240 L420 190 L600 130 L780 120 L900 190" stroke="#C9A227" stroke-width="3" fill="none" stroke-linejoin="round"/>
<text x="40" y="100.0" font-size="10.5" fill="#8AADCC" text-anchor="start" font-weight="normal">Leistungsfähigkeit der Gruppe</text>
<circle cx="118" cy="217" r="7" fill="#3D7DCA" stroke="#FFFFFF" stroke-width="1.5"/>
<rect x="30" y="262" width="176" height="50" fill="#3D7DCA" rx="6"/>
<text x="118" y="284.0" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">FORMING</text>
<text x="118" y="302.0" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="normal">Orientierung</text>
<rect x="30" y="318" width="176" height="78" fill="#1A2A3A" rx="4"/>
<text x="40" y="334.0" font-size="9.5" fill="#8AADCC" text-anchor="start" font-weight="bold">GRUPPE</text>
<text x="40" y="350.0" font-size="11" fill="#E0E8F0" text-anchor="start" font-weight="normal">Unsicherheit, Höflichkeit,</text>
<text x="40" y="363.8" font-size="11" fill="#E0E8F0" text-anchor="start" font-weight="normal">Abhängigkeit von Leitung</text>
<rect x="30" y="400" width="176" height="78" fill="#162030" rx="4"/>
<text x="40" y="416.0" font-size="9.5" fill="#C9A227" text-anchor="start" font-weight="bold">LEITUNG</text>
<text x="40" y="432.0" font-size="11" fill="#E0E8F0" text-anchor="start" font-weight="normal">Struktur, Ziele,</text>
<text x="40" y="445.8" font-size="11" fill="#E0E8F0" text-anchor="start" font-weight="normal">Kennenlernen, Erwartungen</text>
<text x="40" y="459.5" font-size="11" fill="#E0E8F0" text-anchor="start" font-weight="normal">klären</text>
<circle cx="300" cy="225" r="7" fill="#B03A2E" stroke="#FFFFFF" stroke-width="1.5"/>
<rect x="212" y="262" width="176" height="50" fill="#B03A2E" rx="6"/>
<text x="300" y="284.0" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">STORMING</text>
<text x="300" y="302.0" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="normal">Auseinandersetzung</text>
<rect x="212" y="318" width="176" height="78" fill="#1A2A3A" rx="4"/>
<text x="222" y="334.0" font-size="9.5" fill="#8AADCC" text-anchor="start" font-weight="bold">GRUPPE</text>
<text x="222" y="350.0" font-size="11" fill="#E0E8F0" text-anchor="start" font-weight="normal">Konflikte um Rollen,</text>
<text x="222" y="363.8" font-size="11" fill="#E0E8F0" text-anchor="start" font-weight="normal">Einfluss und Vorgehen</text>
<rect x="212" y="400" width="176" height="78" fill="#162030" rx="4"/>
<text x="222" y="416.0" font-size="9.5" fill="#C9A227" text-anchor="start" font-weight="bold">LEITUNG</text>
<text x="222" y="432.0" font-size="11" fill="#E0E8F0" text-anchor="start" font-weight="normal">Konflikte normalisieren,</text>
<text x="222" y="445.8" font-size="11" fill="#E0E8F0" text-anchor="start" font-weight="normal">moderieren, Regeln</text>
<text x="222" y="459.5" font-size="11" fill="#E0E8F0" text-anchor="start" font-weight="normal">aushandeln</text>
<circle cx="482" cy="169" r="7" fill="#B8860B" stroke="#FFFFFF" stroke-width="1.5"/>
<rect x="394" y="262" width="176" height="50" fill="#B8860B" rx="6"/>
<text x="482" y="284.0" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">NORMING</text>
<text x="482" y="302.0" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="normal">Normbildung</text>
<rect x="394" y="318" width="176" height="78" fill="#1A2A3A" rx="4"/>
<text x="404" y="334.0" font-size="9.5" fill="#8AADCC" text-anchor="start" font-weight="bold">GRUPPE</text>
<text x="404" y="350.0" font-size="11" fill="#E0E8F0" text-anchor="start" font-weight="normal">Vereinbarungen,</text>
<text x="404" y="363.8" font-size="11" fill="#E0E8F0" text-anchor="start" font-weight="normal">Zusammenhalt, Rollen klären</text>
<text x="404" y="377.5" font-size="11" fill="#E0E8F0" text-anchor="start" font-weight="normal">sich</text>
<rect x="394" y="400" width="176" height="78" fill="#162030" rx="4"/>
<text x="404" y="416.0" font-size="9.5" fill="#C9A227" text-anchor="start" font-weight="bold">LEITUNG</text>
<text x="404" y="432.0" font-size="11" fill="#E0E8F0" text-anchor="start" font-weight="normal">Vereinbarungen festigen,</text>
<text x="404" y="445.8" font-size="11" fill="#E0E8F0" text-anchor="start" font-weight="normal">Verantwortung übergeben</text>
<circle cx="664" cy="126" r="7" fill="#2E9466" stroke="#FFFFFF" stroke-width="1.5"/>
<rect x="576" y="262" width="176" height="50" fill="#2E9466" rx="6"/>
<text x="664" y="284.0" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">PERFORMING</text>
<text x="664" y="302.0" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="normal">Arbeitsphase</text>
<rect x="576" y="318" width="176" height="78" fill="#1A2A3A" rx="4"/>
<text x="586" y="334.0" font-size="9.5" fill="#8AADCC" text-anchor="start" font-weight="bold">GRUPPE</text>
<text x="586" y="350.0" font-size="11" fill="#E0E8F0" text-anchor="start" font-weight="normal">Selbststeuerung, Fokus auf</text>
<text x="586" y="363.8" font-size="11" fill="#E0E8F0" text-anchor="start" font-weight="normal">Aufgabe, gegenseitige Hilfe</text>
<rect x="576" y="400" width="176" height="78" fill="#162030" rx="4"/>
<text x="586" y="416.0" font-size="9.5" fill="#C9A227" text-anchor="start" font-weight="bold">LEITUNG</text>
<text x="586" y="432.0" font-size="11" fill="#E0E8F0" text-anchor="start" font-weight="normal">Zurücktreten, beraten,</text>
<text x="586" y="445.8" font-size="11" fill="#E0E8F0" text-anchor="start" font-weight="normal">Hindernisse aus dem Weg</text>
<text x="586" y="459.5" font-size="11" fill="#E0E8F0" text-anchor="start" font-weight="normal">räumen</text>
<circle cx="846" cy="158" r="7" fill="#7E57C2" stroke="#FFFFFF" stroke-width="1.5"/>
<rect x="758" y="262" width="176" height="50" fill="#7E57C2" rx="6"/>
<text x="846" y="284.0" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">ADJOURNING</text>
<text x="846" y="302.0" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="normal">Abschluss</text>
<rect x="758" y="318" width="176" height="78" fill="#1A2A3A" rx="4"/>
<text x="768" y="334.0" font-size="9.5" fill="#8AADCC" text-anchor="start" font-weight="bold">GRUPPE</text>
<text x="768" y="350.0" font-size="11" fill="#E0E8F0" text-anchor="start" font-weight="normal">Bilanz, Abschied, Trauer</text>
<text x="768" y="363.8" font-size="11" fill="#E0E8F0" text-anchor="start" font-weight="normal">oder Erleichterung</text>
<rect x="758" y="400" width="176" height="78" fill="#162030" rx="4"/>
<text x="768" y="416.0" font-size="9.5" fill="#C9A227" text-anchor="start" font-weight="bold">LEITUNG</text>
<text x="768" y="432.0" font-size="11" fill="#E0E8F0" text-anchor="start" font-weight="normal">Würdigen, auswerten,</text>
<text x="768" y="445.8" font-size="11" fill="#E0E8F0" text-anchor="start" font-weight="normal">Abschlussritual</text>
<text x="480.0" y="505.0" font-size="10.5" fill="#8AADCC" text-anchor="middle" font-weight="normal">Heuristik, kein Naturgesetz – Phasen überlappen und kehren wieder. Quellen: Tuckman 1965 · Tuckman &amp; Jensen 1977</text>
</svg>
