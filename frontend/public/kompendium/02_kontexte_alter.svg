<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="KONTEXTE – WER LERNT?">
<rect x="0" y="0" width="960" height="560" fill="#0F1E2E" rx="12"/>
<text x="480.0" y="38.0" font-size="20" fill="#FFFFFF" text-anchor="middle" font-weight="bold">KONTEXTE – WER LERNT?</text>
<line x1="60" y1="50" x2="900" y2="50" stroke="#C9A227" stroke-width="2"/>
<text x="480.0" y="70.0" font-size="12" fill="#8AADCC" text-anchor="middle" font-weight="normal">Was sich zwischen Kindern, Jugendlichen und Erwachsenen für die Methodenwahl ändert</text>
<rect x="35" y="90" width="290" height="52" fill="#2A9DB0" rx="6"/>
<text x="180.0" y="113.0" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="bold">KINDER</text>
<text x="180.0" y="132.0" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="normal">ca. 3–10 Jahre</text>
<rect x="35" y="152" width="290" height="66" fill="#1A2A3A" rx="4"/>
<text x="47" y="170.0" font-size="10.5" fill="#2A9DB0" text-anchor="start" font-weight="bold">AUFMERKSAMKEIT</text>
<text x="47" y="188.0" font-size="11.5" fill="#E0E8F0" text-anchor="start" font-weight="normal">Kurze Phasen, häufige Wechsel, Bewegung</text>
<text x="47" y="202.9" font-size="11.5" fill="#E0E8F0" text-anchor="start" font-weight="normal">einplanen</text>
<rect x="35" y="222" width="290" height="66" fill="#162030" rx="4"/>
<text x="47" y="240.0" font-size="10.5" fill="#2A9DB0" text-anchor="start" font-weight="bold">WAS TRÄGT</text>
<text x="47" y="258.0" font-size="11.5" fill="#E0E8F0" text-anchor="start" font-weight="normal">Spiel, Handeln mit Material, Geschichten,</text>
<text x="47" y="272.9" font-size="11.5" fill="#E0E8F0" text-anchor="start" font-weight="normal">Rituale</text>
<rect x="35" y="292" width="290" height="66" fill="#1A2A3A" rx="4"/>
<text x="47" y="310.0" font-size="10.5" fill="#2A9DB0" text-anchor="start" font-weight="bold">SELBSTREGULATION</text>
<text x="47" y="328.0" font-size="11.5" fill="#E0E8F0" text-anchor="start" font-weight="normal">Exekutive Funktionen im Aufbau –</text>
<text x="47" y="342.9" font-size="11.5" fill="#E0E8F0" text-anchor="start" font-weight="normal">Co-Regulation durch Erwachsene</text>
<rect x="35" y="362" width="290" height="66" fill="#162030" rx="4"/>
<text x="47" y="380.0" font-size="10.5" fill="#2A9DB0" text-anchor="start" font-weight="bold">TYPISCHE METHODEN</text>
<text x="47" y="398.0" font-size="11.5" fill="#E0E8F0" text-anchor="start" font-weight="normal">Angeleitetes Spiel, dialogisches Vorlesen,</text>
<text x="47" y="412.9" font-size="11.5" fill="#E0E8F0" text-anchor="start" font-weight="normal">Good Behavior Game, Gefühlsuhr</text>
<rect x="35" y="432" width="290" height="66" fill="#1A2A3A" rx="4"/>
<text x="47" y="450.0" font-size="10.5" fill="#2A9DB0" text-anchor="start" font-weight="bold">VORSICHT</text>
<text x="47" y="468.0" font-size="11.5" fill="#E0E8F0" text-anchor="start" font-weight="normal">Abstrakte Reflexion und lange</text>
<text x="47" y="482.9" font-size="11.5" fill="#E0E8F0" text-anchor="start" font-weight="normal">Gruppenarbeiten überfordern</text>
<rect x="345" y="90" width="290" height="52" fill="#7E57C2" rx="6"/>
<text x="490.0" y="113.0" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="bold">JUGENDLICHE</text>
<text x="490.0" y="132.0" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="normal">ca. 11–18 Jahre</text>
<rect x="345" y="152" width="290" height="66" fill="#1A2A3A" rx="4"/>
<text x="357" y="170.0" font-size="10.5" fill="#B39DDB" text-anchor="start" font-weight="bold">AUFMERKSAMKEIT</text>
<text x="357" y="188.0" font-size="11.5" fill="#E0E8F0" text-anchor="start" font-weight="normal">Längere Phasen möglich, wenn relevant und</text>
<text x="357" y="202.9" font-size="11.5" fill="#E0E8F0" text-anchor="start" font-weight="normal">herausfordernd</text>
<rect x="345" y="222" width="290" height="66" fill="#162030" rx="4"/>
<text x="357" y="240.0" font-size="10.5" fill="#B39DDB" text-anchor="start" font-weight="bold">WAS TRÄGT</text>
<text x="357" y="258.0" font-size="11.5" fill="#E0E8F0" text-anchor="start" font-weight="normal">Peers, Status, Autonomie, Sinn und</text>
<text x="357" y="272.9" font-size="11.5" fill="#E0E8F0" text-anchor="start" font-weight="normal">Identität</text>
<rect x="345" y="292" width="290" height="66" fill="#1A2A3A" rx="4"/>
<text x="357" y="310.0" font-size="10.5" fill="#B39DDB" text-anchor="start" font-weight="bold">SELBSTREGULATION</text>
<text x="357" y="328.0" font-size="11.5" fill="#E0E8F0" text-anchor="start" font-weight="normal">Wächst, aber Belohnungssensitivität und</text>
<text x="357" y="342.9" font-size="11.5" fill="#E0E8F0" text-anchor="start" font-weight="normal">soziale Bewertung hoch</text>
<rect x="345" y="362" width="290" height="66" fill="#162030" rx="4"/>
<text x="357" y="380.0" font-size="10.5" fill="#B39DDB" text-anchor="start" font-weight="bold">TYPISCHE METHODEN</text>
<text x="357" y="398.0" font-size="11.5" fill="#E0E8F0" text-anchor="start" font-weight="normal">Peer Instruction, Debatte, Projekte,</text>
<text x="357" y="412.9" font-size="11.5" fill="#E0E8F0" text-anchor="start" font-weight="normal">Klassenrat, WOOP</text>
<rect x="345" y="432" width="290" height="66" fill="#1A2A3A" rx="4"/>
<text x="357" y="450.0" font-size="10.5" fill="#B39DDB" text-anchor="start" font-weight="bold">VORSICHT</text>
<text x="357" y="468.0" font-size="11.5" fill="#E0E8F0" text-anchor="start" font-weight="normal">Bloßstellen vor der Gruppe, kontrollierende</text>
<text x="357" y="482.9" font-size="11.5" fill="#E0E8F0" text-anchor="start" font-weight="normal">Sprache, Kinderspiele</text>
<rect x="655" y="90" width="290" height="52" fill="#C2652E" rx="6"/>
<text x="800.0" y="113.0" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="bold">ERWACHSENE</text>
<text x="800.0" y="132.0" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="normal">Weiterbildung, Teams</text>
<rect x="655" y="152" width="290" height="66" fill="#1A2A3A" rx="4"/>
<text x="667" y="170.0" font-size="10.5" fill="#C2652E" text-anchor="start" font-weight="bold">AUFMERKSAMKEIT</text>
<text x="667" y="188.0" font-size="11.5" fill="#E0E8F0" text-anchor="start" font-weight="normal">Sandwich – Input höchstens 15–20 Min., dann</text>
<text x="667" y="202.9" font-size="11.5" fill="#E0E8F0" text-anchor="start" font-weight="normal">verarbeiten</text>
<rect x="655" y="222" width="290" height="66" fill="#162030" rx="4"/>
<text x="667" y="240.0" font-size="10.5" fill="#C2652E" text-anchor="start" font-weight="bold">WAS TRÄGT</text>
<text x="667" y="258.0" font-size="11.5" fill="#E0E8F0" text-anchor="start" font-weight="normal">Erfahrung, Problembezug, Nutzen, Mitsprache</text>
<rect x="655" y="292" width="290" height="66" fill="#1A2A3A" rx="4"/>
<text x="667" y="310.0" font-size="10.5" fill="#C2652E" text-anchor="start" font-weight="bold">SELBSTREGULATION</text>
<text x="667" y="328.0" font-size="11.5" fill="#E0E8F0" text-anchor="start" font-weight="normal">Meist hoch, aber Zeit und Transfer sind</text>
<text x="667" y="342.9" font-size="11.5" fill="#E0E8F0" text-anchor="start" font-weight="normal">knapp</text>
<rect x="655" y="362" width="290" height="66" fill="#162030" rx="4"/>
<text x="667" y="380.0" font-size="10.5" fill="#C2652E" text-anchor="start" font-weight="bold">TYPISCHE METHODEN</text>
<text x="667" y="398.0" font-size="11.5" fill="#E0E8F0" text-anchor="start" font-weight="normal">Fallarbeit, kollegiale Beratung, World</text>
<text x="667" y="412.9" font-size="11.5" fill="#E0E8F0" text-anchor="start" font-weight="normal">Café, Retrospektive, Transferplan</text>
<rect x="655" y="432" width="290" height="66" fill="#1A2A3A" rx="4"/>
<text x="667" y="450.0" font-size="10.5" fill="#C2652E" text-anchor="start" font-weight="bold">VORSICHT</text>
<text x="667" y="468.0" font-size="11.5" fill="#E0E8F0" text-anchor="start" font-weight="normal">Belehren ohne Bezug, ungefragte</text>
<text x="667" y="482.9" font-size="11.5" fill="#E0E8F0" text-anchor="start" font-weight="normal">Selbstoffenbarung, »Spielchen«</text>
<text x="480.0" y="520.0" font-size="12" fill="#C9A227" text-anchor="middle" font-weight="normal" font-style="italic">Entwicklungsstand, Vorwissen und Sprache zählen mehr als das Alter – Altersangaben sind Orientierung.</text>
<text x="480.0" y="545.0" font-size="10.5" fill="#8AADCC" text-anchor="middle" font-weight="normal">Quellen: Diamond 2013 · Skene et al. 2022 · Blakemore &amp; Mills 2014 · Knowles et al. 2015 · Wahl 2013</text>
</svg>
