[pytest]
testpaths = api/tests
; -n auto runs tests in parallel worker processes (pytest-xdist). Combined
; with the timeout below, a websocket test whose asyncio event loop wedges on
; a Windows I/O completion port (unkillable at the Python level, so
; pytest-timeout can only take down that worker) no longer blocks the rest of
; the suite — xdist just replaces the crashed worker and carries on.
addopts = -v --tb=short -n auto
; Windows has no SIGALRM, so the timeout has to be enforced from a watchdog
; thread rather than a signal.
timeout = 30
timeout_method = thread
