  - id: leben
    name: Rock your Life
    kann:
      - Lebenssimulation über fünf Jahre (Juli 2026 bis Juni 2031) nach der 10. Klasse in Erfurt
      - Übung für den Einstieg in Leichter Sprache — elf Aufgaben, je nur der nötige Knopf sichtbar und blinkend, Vorschau auf die nächste Aufgabe und auf das, was im richtigen Spiel dazukommt
      - Start mit Figur, Herkunft (Eltern in jedem Erfurter Stadtteil oder Außenort bzw. auf dem Land, Einkommen, Kindergeld-Absprache) und Abschlusszeugnis — selbst ausgefüllt oder per Knopf erzeugt (gut/mittel/schlecht), Bestehen nach § 51 ThürSchulO
      - Rund 55 Wege: Ausbildungen aus allen Bereichen (Vergütung nach dem Thüringer Verzeichnis 03/2026, gesetzliche Mindestvergütung als Untergrenze), Helferjobs, schulische Ausbildung
      - Übergangsjahr mit echten Trägern, Taschengeld, Fristen und Links: FSJ (Soziales, Kultur, Sport, Denkmal, Rettungsdienst), FÖJ (egapark, Forst, Hainich, Schutzstation Wattenmeer Sylt, Friedrichskoog), BFD, EQ mit Übernahme, FOS, Wehrdienst, weltwärts, ESK, Au-pair, Work & Travel; Unterkunft vor Ort, Kindergeld je Modell
      - Nach dem Abschluss Fachkraft-Stellen bei anderen Betrieben (Wechsel mit Kündigungsfrist), Minijobs am Samstag (603-€-Grenze), Sportverein/Musikschule
      - Kleidung (sechs Teile, Billig/Kette/Marke/Second-Hand) mit Verschleiß, Friseur und Handy-Alter; Auftreten zählt im Vorstellungsgespräch
      - Mobil-App: Deutschlandticket, Rad, Führerschein (Fahrschule ≈ 3 900 €, Theorie/Praxis, Probezeit), Auto mit Versicherung nach Alter, Kfz-Steuer, Sprit, TÜV, Pannen
      - Checkliste »Nächste Schritte«, Möbel im Grundriss ziehen und drehen, Nachsendeauftrag, Internet mit Schalttermin
      - Bewerbung mit Anschreiben-Bausteinen, Chance nach Noten/Abschluss/Konkurrenz, Einstellungstest und Vorstellungsgespräch als Minispiel, Zusage annehmen
      - Ausbildung mit Probezeit, Berufsschule, Urlaub, Abmahnung/Kündigung, Zwischen- und Abschlussprüfung, Übernahme als Fachkraft
      - Lohnabrechnung 2026 (Lohnsteuer § 32a, Soli, Kirchensteuer, KV/PV/RV/AV), Werte ab 2027 als gekennzeichnete Annahme
      - Wohnung als 3D-Puppenhaus (Toon-Look, Plattform-Avatar läuft flüssig durch die Türen, liegt im Bett, Licht nachts, Möbel ziehen/drehen) oder als Grundriss von oben, mit Unordnung und Tageszeit; sieben Bedürfnisse (Hunger, Energie, Hygiene, Soziales, Spaß, Gesundheit, Ordnung)
      - Aktionen zu Hause und »Raus!« (Arbeit, Einkaufen, Möbel, Ausgehen, Eltern, Arzt, Amt, Sport); Routine für Tage und Wochen
      - Supermärkte mit rund 200 Produkten (Eigenmarke, Marke, Bio, Nährwerte), simulierte Wochenangebote (Saisonware bevorzugt), Saisonpreise (Kürbis, Spargel, Lebkuchen nur in der Saison), echte Preise von REWE-Kassenbons, Referenz-Wocheneinkauf, »Was fehlt?«
      - Ernährung aus dem Vorrat (kcal, Obst/Gemüse, Eiweiß, Zucker), Verderb ohne Kühlschrank, Kochen nur mit Kochplatte
      - Einrichten neu (IKEA-/Elektromarkt-Preise) oder über Kleinanzeigen (günstig, Defekte, Betrug bei Vorkasse)
      - Wohnungsmarkt in echten Erfurter Stadtteilen, WG, Azubi-Wohnheim, Besichtigung, Kaution (auch in Raten), Umzug, Anmeldepflicht
      - Verträge mit Bewertung: Strom (SWE-Grundversorgung), Internet, Handy, Versicherungen, Abos, Fitness, Deutschlandticket
      - Behörden-Minispiel mit echten Links: Anmeldung, BAB, Wohngeld (Formel § 19 WoGG, Mietstufe III), Rundfunk, Kindergeld-Abzweigung, Krankenkasse, ALG I (3-Tage-Frist), Bürgergeld, Schuldnerberatung
      - Steuer-App (Belegabruf, Anlage N, § 35a, Steuerampel) mit Erstattung
      - Rund 60 Zufallsereignisse mit Häufigkeiten, dazu Fallen (Phishing, Fakeshop, Abofalle, BNPL, Ratenkauf, Krypto, Wetten) und Mahnwesen bis zur Kontopfändung
      - Ausgehen mit Promille nach Widmark, Kater, Alkoholvergiftung, Polizei und Jugendschutz
      - Bank-App mit Umsätzen, Monatsbilanz nach Kategorien, Brutto→Netto, Steuern & SV gesamt mit Rentenpunkten, Sparen, Kredite
      - Recherche-Heft und Recherche-Preise im Laden (echte Werte mit Quelle eintragen und vergleichen)
      - Spielstand im Browser und als JSON zum Herunter-/Hochladen (auch für Gäste)
      - Klassenübersicht für die Lehrkraft mit Stand je Person und Protokoll als CSV
  - id: leviathan
    name: Leviathan – Kunst des Regierens
    kann:
      - Vernetzte Regierungssimulation, inspiriert von Vesters Vernetztem Denken (Ökolopoly), mit eigenen Regeln und Quellen 2016–2026
      - Neun fiktive Ländertypen mit belegten realen Beispielen (nordisch, Industrienation, polarisierte Großdemokratie, Wahlautokratie, Schwellenland, Rohstoffstaat, autoritärer Entwicklungsstaat, junge fragile Gesellschaft, Küstenstaat)
      - Sechs Hebel mit abnehmendem Ertrag, Verfall ohne Pflege, Effizienz nach Korruption und Staatskapazität, Lernkurve der Energiewende, Kredite mit Zinsen
      - Wirkungsgefüge mit Verzögerungen und Kipppunkten; Bevölkerung mit Altersstruktur und Geburtenrate nach Bildung
      - Leviathan-Anzeige (abwesend / gefesselt / despotisch) nach Acemoglu & Robinson, Korridor wird mit Stärke enger
      - Rund 70 zustandsabhängige Schocks in acht Gruppen, Abfederung je Schock, Wahlen alle vier Jahre mit Populismus-Chance aus Vertrauen, Ungleichheit, Desinformation, Finanzkrise und Deepfakes
      - »Warum?« an jeder Größe mit Befund und Quelle, umstrittene Befunde gekennzeichnet
      - Quellenverzeichnis (23 Belege nach Thema) mit vollständiger Angabe, DOI-Links und »im Spiel verwendet«
      - Sofortwirkung von Programmen je Investition (Medienbildung, Antikorruption, Grundsicherung …), Netto-Vorschau je Bereich, Korruption kostet Haushalt
      - Zeitlupe: letzte Runde Takt für Takt mit fließenden Pfeilen und laufenden Werten, Tempo wählbar, optional nach jeder Runde automatisch; Punkte auch direkt im Wirkungsnetz verteilen
      - Rechenweg jeder Runde in neun Schritten mit jedem Beitrag, Grund und Quelle; eine Größe als Wasserfall verfolgen; die wirkenden Pfeile leuchten im Netz
      - Wirkungsnetz als Kreis (Spielbrett-Stil): Pfeile mit Live-Stärke oder Regelrichtung, verteilte Punkte leuchten mit Folgen erster und zweiter Ordnung, Rückkopplungsschleifen im Netz
      - Einstellungen der Lehrkraft an der Sitzung: Krisenstufe (ruhig, normal, stürmisch, Szenario Zusammenbruch), Rundenzahl, sichtbar/verdeckt, heikle Ereignisse aus, Drehbuch mit festen Ereignissen
      - Zusammenbruch mit optionalem Wiederaufbau; Nachbesprechung mit Punkten, Verläufen, Wendepunkt und aktiven Rückkopplungsschleifen; Verlauf als JSON
  - id: kueste
    name: Küstendynamik
    kann:
      - Querschnitt durch drei Küsten: Flachküste (Vorbild Sylt), Steilküste (Vorbild Kap Arkona), Marsch mit altem Deich
      - Laufende Wellen mit Brecherzone am Sandriff, Rollerzone und Spülsaum; Gezeiten, Windstau und Sturmfluten
      - Erosion im Zeitraffer bis 1 Jahr/s: Sturm trägt Sand ins Riff, ruhiges Wetter baut den Strand auf, der Längsstrom nimmt Sand mit, Wind baut Dünen
      - Steilküste als unverzerrtes 2D-Zellmodell mit vier Kliffen (Kreide/Jasmund, Møns Klint, Geschiebemergel/Brodtener Ufer, Sand/Rotes Kliff)
      - Hohlkehle aus dem Brandungsband, Abbruch des Überhangs nach Biegespannung, Rutschungen und Gleitungen nach Standsicherheit (Gleitkreise, frei ausstreichende Schichtflächen, Grundwasserdruck), Ablauf als Gleitklotz mit Restreibung und Auslauf; Überhängendes bricht danach ab; Kreide (Jasmund, Møn) bricht an fast senkrechten Klüften ab und zerfällt zu Schutt; verrutschtes Gestein verwittert schnell
      - Frost, Regen, gerundete Abbruchkante, Quellhorizont, Schlammstrom, Abrieseln, Wind; Kliffhalde, Blockstrand, Abrasionsplattform; Physik-Tafel
      - Bäume sterben an der Kante oder auf abgerutschten Schollen ab, stürzen seewärts und verrotten oder treiben als Treibholz fort
      - Zoom (Mausrad, Ziehen, Wasserlinie) und ovale Trefferzonen im Beschriften-Quiz
      - Deichüberlauf und Deichbruch (alter, innen steiler Deich), Überflutung des Koogs
      - Küstenschutz mit Kosten, Vor- und Nachteilen: Sand- und Riffaufspülung, Strandhafer/Sandfangzäune, Deckwerk/Tetrapoden, Klimadeich, Lahnungen, Zurückweichen, Kliffweg sperren
      - Wetter von Hand oder im Jahreslauf; Meldungen, Sandbilanz, Schäden
      - Mitwandernde Profilbeschriftung wie im Schulbuch und Beschriften-Quiz
      - Draufsicht: Küstenlängsstrom mit Strandversetzung, Buhnen (Luv/Lee), Deckwerk am Kliff, Aufspülung, wachsender Haken
      - Gezeiten: Erde/Mond mit Flutbergen, Spring- und Nipptide, Pegelkurve und Tidenkalender für Nord- und Ostseeorte, Watt mit Priel
      - Lupenzoom (Klick zoomt an die Lupenstelle), nie weiter hinaus als die Grundansicht
      - Galerie »Echte Küsten«: 53 frei lizenzierte Commons-Fotos (Rügen, Møns Klint, Steilufer, Watt, Küstenschutz) mit Erklärung und Nachweis, passende Fotos unter jedem Kliff
      - Wissensteil mit Quellen
  - id: erdaufbau
