# TT - Teaching Tools: Feature-Übersicht (maschinenlesbar)
# Die ausführliche Fassung steht in README.md. Freigabe-Defaults je Werkzeug
# kommen aus api/tool_catalog.py, dort ist die verbindliche Quelle.

projekt:
  name: TT - Teaching Tools
  beschreibung: >-
    Schulweites Punktesystem und Unterrichtsplattform. Lehrkräfte vergeben
    Punkte an Klassen, die Klassen sammeln in Häusern für den Hauspokal. Dazu
    Aktivitäten, Simulationen, Unterrichtswerkzeuge, Klassenverwaltung, Kalender
    und Startseiten-Slideshow, alles auf dem eigenen Schulserver.
  stack:
    frontend: [Next.js 16, React 19, Tailwind CSS 4, TanStack Query, KaTeX, three.js]
    backend: [FastAPI, SQLAlchemy, WebSockets]
    datenbank: PostgreSQL 17
    betrieb: Docker Compose (postgres, api, frontend), LibreOffice für PDF-Exporte
  dienste:
    frontend: http://localhost:1339
    api: http://localhost:8000
    postgres: localhost:5435

# Fähigkeiten je Werkzeug: use = Öffnen/Beitreten, host = Hosten,
# create = Erstellen, upload = Hochladen. Werte: Default für lehrkraft / schueler.

kern:
  - id: hauspokal
    name: Hauspokal (Startseite)
    kann:
      - Live-Diagramm aller Häuser mit animierten WebGL-Balken
      - Häuser zählen die Punkte ihrer Klassen zusammen, automatische Aktualisierung
  - id: punkte
    name: Punkte vergeben
    kann:
      - Schnellauswahl (+5 bis +100) oder freie Punktzahl mit Grund
      - Punkte-Leitfaden mit Richtwerten von 5 bis 500
      - Punkte an Klassen, Kurse, Wahlpflicht- und A/B-Gruppen
      - Punkte-Log je Klasse, Löschen nur für Admins
      - Klassen-Spitznamen
      - Automatische Punkte aus Caputh, Bingo, TaskCrawler und Maus-Führerschein
      - Kurs-/WPF-Sitzungen bewerten jede beteiligte Klasse nach eigener Quote
  - id: playhub
    name: Mitmachen per Code
    kann:
      - "/play: ein Code für alle Werkzeuge, Weiterleitung zum richtigen Werkzeug"
      - QR-Code je Sitzung
      - Befristeter Gastzugang ohne Konto, gilt nur für eine Sitzung
      - Gastzugang schließt nach dem eingestellten Fenster von selbst
      - Sitzungen für Klasse, A/B-Hälfte, Kurs oder WPF-Gruppe

aktivitaeten:
  - id: caputh
    name: Caputh
    typ: Quiz
    faehigkeiten: {use: [true, true], host: [true, false], upload: [true, true]}
    kann:
      - Modi Klassisch, TÜ, Test, Aufgabe, Wettbewerb, Benutzerdefiniert
      - Live-Sitzung mit Host-Screen, Beitritt per Code, Team-Modus
      - Bilder in Fragen, eingebettete Lückentexte und Zeitstrahlen
      - Gruppenauswertung
      - Import als .json/.zip, Vorlage
      - Bearbeiten per Formular (alle Fragetypen inkl. Zeitstrahl, Bilder direkt hochladen), frühere Auswertungen bleiben gültig
  - id: bingo
    name: Bingo
    faehigkeiten: {use: [true, true], host: [true, false], create: [true, true]}
    kann:
      - Rastergröße und Caller/Antwort-Paare frei wählbar
      - Eigene Karte für jede Person
      - JSON-Import, Vorlage, Prompt für externe KI
      - Sets bearbeiten
      - Zurücksetzen oder neu starten (alle Karten neu gemischt)
      - Auswertung je Karte: Treffer gegen auf der eigenen Karte Gerufenes
  - id: exitgame
    name: TaskCrawler
    faehigkeiten: {use: [true, true], host: [true, false], upload: [true, true]}
    kann:
      - Spielen im eigenen Tempo, Fortschritt live für die Lehrkraft
      - Codeschnipsel aus Aufgaben öffnen die Tür
      - Serverseitige Fuzzy-Anpassung der Schwierigkeit (Hinweise, Zeitlimits, leichtere Aufgaben)
      - Aufgaben aus Generatoren, eingebettete Lückentexte und Zeitstrahlen
      - Import als .json/.zip, Vorlage mit allen Bausteinen
      - Bearbeiten per Formular: Folien, Aufgaben, Codeschnipsel, Hinweise, Objekte, Werkzeuge, Bilder direkt hochladen
      - Gebäude-Ansicht: isometrisches Haus (three.js), Abschnitt = Stockwerk, Folie = Zimmer, Tür = Treppenhaus; Grundriss wächst aus den Regeln des Regel-Labors, gleicher Code = gleiches Haus
      - Drei 2.5D-Arten: Gebäude (Treppen hinauf), Verlies (Ebenen hinab, nur die aktuelle sichtbar, Fackellicht, Monster und Bosse, die besiegt am Boden liegen) und Ebene (Abschnitte nebeneinander, verschlossene Türen); jederzeit zurück; Zifferntasten 1–9/0 laufen zu Zimmer bzw. Treppe
      - Zwei Vorlagen: schlank (Folien-Bausteine) und interaktiv (spielbares Verlies mit Stationen, Monstern, Bossen, Werkzeugen, »gebaeude«-Startansicht)
      - Spielfigur wählbar: sechs Klassen (Normal, Krieger, Magier, Priester, Rapper, Rocker), männlich/weiblich, vier Hauttöne, oder die 30 Avatar-Tiere als 3D-Figuren; drehende Vorschau; gespeichert auf dem Gerät (auch im Regel-Labor); TaskCrawler fragt beim ersten Betreten, Gäste bekommen ihr Beitritts-Tier
      - Textfassung (📄 Text) immer neben der 2.5D-Ansicht wählbar
      - Ergebnissicherung: Merksatz je Folie (»ergebnissicherung«), am Ende als gestaltetes PDF nach Abschnitten mit Namen und Datum; kommt erst mit /finish (kann Lösungen enthalten)
      - 39 Stationsobjekte inkl. Medien durch die Zeit (neu: Lagerfeuer, Quipu, Orakelknochen, Maya-Faltbuch, Tastenhandy, Röhren-PC) (Höhlenmalerei bis KI-Rechenzentrum); das Objekt spricht (Telefon klingelt, Radio sendet …); ohne »station« reihum statt Tafel/Schreibtisch
      - Beispiel »Zeitreise der Medien«: sechs Epochen (Steinzeit bis Photoshop/Deepfakes/ChatGPT) mit Epochen-Stil und passenden Geräten; freiwillige 🌍-Aufgaben am Globus ohne Codeschnipsel (China, Korea, Inka, Maya, Kuba/Lateinamerika, Japan, Kenia)
      - "Interaktive Vorlage mit Nachschlageliste »_katalog«: alle Ansichten, Stile, Objekte und Werkzeuge samt config-Parametern (eine Quelle mit der Upload-Prüfung: api/exitgame_katalog.py)"
      - "17 Stile (Klassisch, Beton, Glas & Neon, Gartenpalast, Verlies, Burg, Holzhütte, Eispalast, Wüstentempel, Raumstation, Lavahöhle, Steinzeithöhle, Antiker Tempel, Mittelalter, Gotik, Viktorianisch, Retro), wahlweise je Abschnitt ein eigener (\"gebaeude\": {\"stile\": […]}), z. B. Zeitreise der Medien von der Steinzeit bis heute; Oberflächen je Stil als gemalte Muster (Fels, Mauerwerk, Dielen, Parkett, Marmor, Fachwerk, Tapete, Teppich, Metall, Eis …), Höhlen organisch aus Felsbrocken mit Tropfsteinen, Verzierungen (Säulen, Turmspitzen, Zinnen, Eiskristalle); Lavahöhle mit glühenden Rissen (leuchten auch im dunklen Verlies); legt das Spiel Ansicht/Stil fest, gibt es keine Auswahl — sonst wählen die Schüler"
      - Stationen anklicken; 13 Objekte in den Zimmern (Computer, Kuckucksuhr, Globus, Tresor …), automatisch passend oder per "station"
      - "Werkzeug-Stationen: eine Aufgabe öffnet eine Simulation mit fester Vorgabe (\"sim\": {tool, config}) — Gleichungswaage, Funktionen, Vierecke, Rechenregeln mit genau einer Aufgabe, alle übrigen auf einen Reiter festgelegt; Antwort wird weiter serverseitig geprüft"
  - id: lueckentext
    name: Lückentext
    faehigkeiten: {use: [true, true], host: [true, false], create: [true, true], upload: [true, true]}
    kann:
      - Lücken als Wortbank, Freitext oder Multiple Choice (Zieh- und Schreiblücken sehen unterschiedlich aus)
      - Live-Runde mit Rangliste, Einzelübung, Korrekturmodus
      - PDF-Export leer oder ausgefüllt
      - Einbettbar in Caputh und TaskCrawler
  - id: zeitstrahl
    name: Zeitstrahl
    faehigkeiten: {use: [true, true], create: [true, true], upload: [true, true]}
    kann:
      - Zeitleisten mit parallelen Spuren und Zahlenstrahlen
      - Anzeigen, einsortieren, Fehler finden
      - JSON-Import, Vorlage, Beispiel-Zeitleisten (u. a. Entdeckungen der Geowissenschaften)
  - id: karten
    name: Karten
    faehigkeiten: {use: [true, true], host: [true, false], create: [true, false], upload: [true, false]}
    kann:
      - Selbst gehostete Karten (MapLibre, keine Anfragen nach außen)
      - Kartennetz Equal Earth (Standard) oder Mercator im ☰-Menü, je Kartensatz gespeichert; schwarz-weiße Maßstabsleiste, Quellen unter der Karte
      - Regionen Deutschland, Thüringen, Europa, Welt, Kontinente; Kartenarten politisch, topographisch, stumm, Wirtschaft, Physisch
      - Ebenen aus offenen Daten (BKG, Natural Earth, OPSD, CORINE, Bird PB2002, Köppen-Geiger) mit Quellenangabe auf der Karte
      - Europa genauer - BIP pro Kopf und Bevölkerungsdichte je NUTS-2-Region, EU/Eurozone/EFTA, Kraftwerke, Verkehr
      - USA-Wirtschaft - Landwirtschaft und Viehhaltung je Bundesstaat, Manufacturing Belt und Sun Belt, Industriestandorte (schematisch)
      - Stadtmodelle Berlin, Paris, New York - Zentrum, Innenstadt, Stadtrand aus amtlichen Bezirken
      - Alle Siedlungen Deutschlands mit Größenklassen-Filter in der Legende, Ortssuche
      - Meeresboden mit Tiefenstufen und Schummerung, Tiefseegräben und Rücken (quizfähig)
      - Meeresströmungen und Windsysteme (ITC, Druckgürtel, Monsun) animiert, einzeln anklickbar, Jahresverlauf per Monatsregler, Partikelfluss
      - Kartensätze: Objekte auswählen, nummerieren (1 2 3, a b c, A B C, I II III), auf dem Server speichern und teilen; der volle Datensatz bleibt unverändert
      - Nummern, die aufeinanderliegen (Berlin als Stadt und Land), rücken auseinander; Landesnamen weichen Stadtnamen aus
      - Arbeitsblatt als PDF, DOCX, ODT oder LaTeX (Karte füllt Seite 1, Querformat-Karten gedreht auf hochkantem Blatt; Tabellen zweispaltig, ein Thema je Spalte; leer oder mit Lösung; PDF in Atkinson Hyperlegible)
      - Seitenformat A4 hoch/quer - Karte im Verhältnis der Seite, füllt Seite 1; Knopf zum Einpassen der Region
      - Eigene Ebenen (GeoJSON, KML, KMZ, GPX) nur für Lehrkräfte
      - JSON-Vorlage mit »aktiv« je Objekt zum Filtern (auch per KI) und wieder hochladen
      - Kartenquiz per Code/QR (benennen oder finden), Prüfung auf dem Server, Hauspunkte je Klasse
      - Erfolge je Kartensatz in neun Arten (Anteil, fehlerfrei, bestimmte Objekte, Serie, auf Zeit, benennen und finden, Fehler aufgeholt, an mehreren Tagen, alle)
      - Lernhelfer »Üben« – Fuzzy-Regeln wählen, was am wenigsten sitzt; unsicher → Auswahl mit Ablenkern (frühere Verwechslungen, Nachbarn, ähnliche Namen), sicher → freie Eingabe; Lernstand über Sitzungen hinweg
      - Üben ohne Code - eingeloggte Schüler üben geteilte Kartensätze direkt, mit Lern-Erfolgen
      - Automatisch weiter - nächste Übungsaufgabe ohne Klick (pro Browser gemerkt)
      - Einbettbar in Caputh und TaskCrawler
  - id: uebung
    name: Übung
    kann:
      - Generierte Mathe-Aufgaben Kl. 1–7 (Thüringer Lehrplan)
      - Schwierigkeit steigt nach drei richtigen, sinkt nach zwei falschen
      - Prüfung auf dem Server, Fortschritt je Thema

# Übersicht /simulationen: Fächer je Simulation (mehrere möglich), Filter nach
# einem oder mehreren Fächern; Admins ändern Fächer schulweit oder legen eigene
# an (school_settings.tool_faecher, Voreinstellungen in frontend/src/lib/faecher.ts).
simulationen:
  - id: gleichungswaage
    name: Gleichungswaage
    kann:
      - Äquivalenzumformungen in den Modi Zahlen, Variablen und Chemie
      - Sieben Stufen, Klammern, Brüche, eigene Gleichungen
      - Teile von Hand auf nur eine Schale ziehen (Waage kippt, Rechenweg zeigt ≠), Plus- und Minus-Teil nebeneinander
      - Motive Streichhölzer/Schachtel, Gummibärchen/Tüte, Murmeln/Säckchen, Münzen/Geldbeutel; stehende Streichhölzer; Minus abgebrannt, angebissen, zerbrochen bzw. schwarz
      - Formeln umstellen (F = m·a, p = F/A)
      - Reaktionsgleichungen ausgleichen mit Ionen, Kernteilchen, Oxidationszahlen, Oktett-Hinweis
      - Rechenweg wie im Heft, LaTeX-Eingabe
  - id: abacus
    name: Abakus
    kann:
      - Rechenrahmen, Modus »Alle gleich« oder »Stellenwert«
  - id: bildformate
    name: Bildformate
    kann:
      - PBM, PGM und PPM als Text bearbeiten, Bild in Echtzeit
      - Ins Bild klicken schreibt den Wert zurück in den Text
  - id: vierecke
    name: Vierecke
    kann:
      - Sechs Vierecke mit Formeln, Rechenweg und Eigenschaften
      - Umfang (Zaun bauen) und Fläche (Einheitsquadrate auslegen)
  - id: binaerrechner
    name: Binär-Rechner
    kann:
      - Acht Bits mit Stellenwerten, Werte von 0 bis 255 mit Rechenweg
  - id: funktionen
    name: Funktionen und Koordinatensystem
    kann:
      - Term, Wertetabelle und Graph miteinander verbunden
      - Formelsatz und Rechenweg je Punkt
      - Normal- und Scheitelpunktform, π-Achsen für Winkelfunktionen
      - Zoom, Achsen einzeln dehnen, Verschieben, Vorlagen würfeln
      - Mehrere Funktionen (f, g, h …) mit Auswahl für die Wertetabelle, Schnittpunkte markiert
      - Graph als SVG, PNG oder PDF exportieren
      - "Koordinaten-Lauf: Punkte im Jump'n'Run setzen (erst laufen, dann springen), 5 Welten mit 23 Leveln"
      - Figuren, Achsen- und Punktsymmetrie, Steigungsdreiecke, y = mx + n
      - Infohappen mit Vorführen, Vorführen je Level, Hinweise zu typischen Fehlern, Sterne
  - id: ki
    name: KI-Werkstatt
    kann:
      - Sprachmodell zum Anfassen (Tokenisieren, Wortnetz, top-k, Klassentafel)
      - Eigenes Netz aus Korpus trainieren, Rückblick und Backoff
      - Attention-Minispiel, Mensch gegen Maschine raten
      - Diffusion (Verrauschen, Bildfolgen, Punktwolke mit Guidance)
      - Neuron lernen lassen, Zeichnen und Erkennen
      - »Echt oder KI« mit eigenen Bildpaaren
      - Hintergrundtexte in drei Lesestufen
  - id: sonnensystem
    name: Sonnensystem
    kann:
      - 3D-Modell mit echten Bahnen (JPL Horizons), Satelliten und Lagrangepunkten
      - Flugmodus mit Pulsantrieb, Overdrive, Autopilot und Scanner
      - 31 Forschungsaufträge, 34 Erfolge, Kodex als PDF
      - Größen, Entfernungen mit Lichtlauf, Kepler-Gesetze
      - Erdmagnetfeld mit Sonnensturm
      - Galerie mit rund 90 Bildern zum Freischalten
  - id: leben
    name: Rock your Life
    kann:
      - Lebenssimulation über fünf Jahre (Juli 2026 bis Juni 2031) nach der 10. Klasse in Erfurt
      - Start mit Figur, Herkunft (Eltern in jedem Erfurter Stadtteil oder Außenort bzw. auf dem Land, Einkommen, Kindergeld-Absprache) und Abschlusszeugnis — selbst ausgefüllt oder per Knopf erzeugt (gut/mittel/schlecht), Bestehen nach § 51 ThürSchulO
      - Rund 55 Wege: Ausbildungen aus allen Bereichen (Vergütung nach dem Thüringer Verzeichnis 03/2026, gesetzliche Mindestvergütung als Untergrenze), Helferjobs, schulische Ausbildung
      - Übergangsjahr mit echten Trägern, Taschengeld, Fristen und Links: FSJ (Soziales, Kultur, Sport, Denkmal, Rettungsdienst), FÖJ (egapark, Forst, Hainich, Schutzstation Wattenmeer Sylt, Friedrichskoog), BFD, EQ mit Übernahme, FOS, Wehrdienst, weltwärts, ESK, Au-pair, Work & Travel; Unterkunft vor Ort, Kindergeld je Modell
      - Nach dem Abschluss Fachkraft-Stellen bei anderen Betrieben (Wechsel mit Kündigungsfrist), Minijobs am Samstag (603-€-Grenze), Sportverein/Musikschule
      - Kleidung (sechs Teile, Billig/Kette/Marke/Second-Hand) mit Verschleiß, Friseur und Handy-Alter; Auftreten zählt im Vorstellungsgespräch
      - Mobil-App: Deutschlandticket, Rad, Führerschein (Fahrschule ≈ 3 900 €, Theorie/Praxis, Probezeit), Auto mit Versicherung nach Alter, Kfz-Steuer, Sprit, TÜV, Pannen
      - Checkliste »Nächste Schritte«, Möbel im Grundriss ziehen und drehen, Nachsendeauftrag, Internet mit Schalttermin
      - Bewerbung mit Anschreiben-Bausteinen, Chance nach Noten/Abschluss/Konkurrenz, Einstellungstest und Vorstellungsgespräch als Minispiel, Zusage annehmen
      - Ausbildung mit Probezeit, Berufsschule, Urlaub, Abmahnung/Kündigung, Zwischen- und Abschlussprüfung, Übernahme als Fachkraft
      - Lohnabrechnung 2026 (Lohnsteuer § 32a, Soli, Kirchensteuer, KV/PV/RV/AV), Werte ab 2027 als gekennzeichnete Annahme
      - Wohnung von oben mit Möbeln, Unordnung und Tageszeit; sieben Bedürfnisse (Hunger, Energie, Hygiene, Soziales, Spaß, Gesundheit, Ordnung)
      - Aktionen zu Hause und »Raus!« (Arbeit, Einkaufen, Möbel, Ausgehen, Eltern, Arzt, Amt, Sport); Routine für Tage und Wochen
      - Supermärkte mit rund 200 Produkten (Eigenmarke, Marke, Bio, Nährwerte), simulierte Wochenangebote (Saisonware bevorzugt), Saisonpreise (Kürbis, Spargel, Lebkuchen nur in der Saison), echte Preise von REWE-Kassenbons, Referenz-Wocheneinkauf, »Was fehlt?«
      - Ernährung aus dem Vorrat (kcal, Obst/Gemüse, Eiweiß, Zucker), Verderb ohne Kühlschrank, Kochen nur mit Kochplatte
      - Einrichten neu (IKEA-/Elektromarkt-Preise) oder über Kleinanzeigen (günstig, Defekte, Betrug bei Vorkasse)
      - Wohnungsmarkt in echten Erfurter Stadtteilen, WG, Azubi-Wohnheim, Besichtigung, Kaution (auch in Raten), Umzug, Anmeldepflicht
      - Verträge mit Bewertung: Strom (SWE-Grundversorgung), Internet, Handy, Versicherungen, Abos, Fitness, Deutschlandticket
      - Behörden-Minispiel mit echten Links: Anmeldung, BAB, Wohngeld (Formel § 19 WoGG, Mietstufe III), Rundfunk, Kindergeld-Abzweigung, Krankenkasse, ALG I (3-Tage-Frist), Bürgergeld, Schuldnerberatung
      - Steuer-App (Belegabruf, Anlage N, § 35a, Steuerampel) mit Erstattung
      - Rund 60 Zufallsereignisse mit Häufigkeiten, dazu Fallen (Phishing, Fakeshop, Abofalle, BNPL, Ratenkauf, Krypto, Wetten) und Mahnwesen bis zur Kontopfändung
      - Ausgehen mit Promille nach Widmark, Kater, Alkoholvergiftung, Polizei und Jugendschutz
      - Bank-App mit Umsätzen, Monatsbilanz nach Kategorien, Brutto→Netto, Steuern & SV gesamt mit Rentenpunkten, Sparen, Kredite
      - Recherche-Heft und Recherche-Preise im Laden (echte Werte mit Quelle eintragen und vergleichen)
      - Spielstand im Browser und als JSON zum Herunter-/Hochladen (auch für Gäste)
      - Klassenübersicht für die Lehrkraft mit Stand je Person und Protokoll als CSV
  - id: leviathan
    name: Leviathan – Kunst des Regierens
    kann:
      - Vernetzte Regierungssimulation, inspiriert von Vesters Vernetztem Denken (Ökolopoly), mit eigenen Regeln und Quellen 2016–2026
      - Neun fiktive Ländertypen mit belegten realen Beispielen (nordisch, Industrienation, polarisierte Großdemokratie, Wahlautokratie, Schwellenland, Rohstoffstaat, autoritärer Entwicklungsstaat, junge fragile Gesellschaft, Küstenstaat)
      - Sechs Hebel mit abnehmendem Ertrag, Verfall ohne Pflege, Effizienz nach Korruption und Staatskapazität, Lernkurve der Energiewende, Kredite mit Zinsen
      - Wirkungsgefüge mit Verzögerungen und Kipppunkten; Bevölkerung mit Altersstruktur und Geburtenrate nach Bildung
      - Leviathan-Anzeige (abwesend / gefesselt / despotisch) nach Acemoglu & Robinson, Korridor wird mit Stärke enger
      - Rund 70 zustandsabhängige Schocks in acht Gruppen, Abfederung je Schock, Wahlen alle vier Jahre mit Populismus-Chance aus Vertrauen, Ungleichheit, Desinformation, Finanzkrise und Deepfakes
      - »Warum?« an jeder Größe mit Befund und Quelle, umstrittene Befunde gekennzeichnet
      - Quellenverzeichnis (23 Belege nach Thema) mit vollständiger Angabe, DOI-Links und »im Spiel verwendet«
      - Sofortwirkung von Programmen je Investition (Medienbildung, Antikorruption, Grundsicherung …), Netto-Vorschau je Bereich, Korruption kostet Haushalt
      - Zeitlupe: letzte Runde Takt für Takt mit fließenden Pfeilen und laufenden Werten, Tempo wählbar, optional nach jeder Runde automatisch; Punkte auch direkt im Wirkungsnetz verteilen
      - Rechenweg jeder Runde in neun Schritten mit jedem Beitrag, Grund und Quelle; eine Größe als Wasserfall verfolgen; die wirkenden Pfeile leuchten im Netz
      - Wirkungsnetz als Kreis (Spielbrett-Stil): Pfeile mit Live-Stärke oder Regelrichtung, verteilte Punkte leuchten mit Folgen erster und zweiter Ordnung, Rückkopplungsschleifen im Netz
      - Einstellungen der Lehrkraft an der Sitzung: Krisenstufe (ruhig, normal, stürmisch, Szenario Zusammenbruch), Rundenzahl, sichtbar/verdeckt, heikle Ereignisse aus, Drehbuch mit festen Ereignissen
      - Zusammenbruch mit optionalem Wiederaufbau; Nachbesprechung mit Punkten, Verläufen, Wendepunkt und aktiven Rückkopplungsschleifen; Verlauf als JSON
  - id: kueste
    name: Küstendynamik
    kann:
      - Querschnitt durch drei Küsten: Flachküste (Vorbild Sylt), Steilküste (Vorbild Kap Arkona), Marsch mit altem Deich
      - Laufende Wellen mit Brecherzone am Sandriff, Rollerzone und Spülsaum; Gezeiten, Windstau und Sturmfluten
      - Erosion im Zeitraffer bis 1 Jahr/s: Sturm trägt Sand ins Riff, ruhiges Wetter baut den Strand auf, der Längsstrom nimmt Sand mit, Wind baut Dünen
      - Steilküste als unverzerrtes 2D-Zellmodell mit vier Kliffen (Kreide/Jasmund, Møns Klint, Geschiebemergel/Brodtener Ufer, Sand/Rotes Kliff)
      - Hohlkehle aus dem Brandungsband, Abbruch des Überhangs nach Biegespannung, Rutschungen und Gleitungen nach Standsicherheit (Gleitkreise, frei ausstreichende Schichtflächen, Grundwasserdruck), Ablauf als Gleitklotz mit Restreibung und Auslauf; Überhängendes bricht danach ab; Kreide (Jasmund, Møn) bricht an fast senkrechten Klüften ab und zerfällt zu Schutt; verrutschtes Gestein verwittert schnell
      - Frost, Regen, gerundete Abbruchkante, Quellhorizont, Schlammstrom, Abrieseln, Wind; Kliffhalde, Blockstrand, Abrasionsplattform; Physik-Tafel
      - Bäume sterben an der Kante oder auf abgerutschten Schollen ab, stürzen seewärts und verrotten oder treiben als Treibholz fort
      - Zoom (Mausrad, Ziehen, Wasserlinie) und ovale Trefferzonen im Beschriften-Quiz
      - Deichüberlauf und Deichbruch (alter, innen steiler Deich), Überflutung des Koogs
      - Küstenschutz mit Kosten, Vor- und Nachteilen: Sand- und Riffaufspülung, Strandhafer/Sandfangzäune, Deckwerk/Tetrapoden, Klimadeich, Lahnungen, Zurückweichen, Kliffweg sperren
      - Wetter von Hand oder im Jahreslauf; Meldungen, Sandbilanz, Schäden
      - Mitwandernde Profilbeschriftung wie im Schulbuch und Beschriften-Quiz
      - Draufsicht: Küstenlängsstrom mit Strandversetzung, Buhnen (Luv/Lee), Deckwerk am Kliff, Aufspülung, wachsender Haken
      - Gezeiten: Erde/Mond mit Flutbergen, Spring- und Nipptide, Pegelkurve und Tidenkalender für Nord- und Ostseeorte, Watt mit Priel
      - Lupenzoom (Klick zoomt an die Lupenstelle), nie weiter hinaus als die Grundansicht
      - Galerie »Echte Küsten«: 53 frei lizenzierte Commons-Fotos (Rügen, Møns Klint, Steilufer, Watt, Küstenschutz) mit Erklärung und Nachweis, passende Fotos unter jedem Kliff
      - Wissensteil mit Quellen
  - id: erdaufbau
    name: Aufbau der Erde
    kann:
      - 3D-Erde mit herausgeschnittenem Keil (Achtel oder Pol zu Pol, Öffnung 30–180°), drehen und zoomen
      - Schichten antippen: Tiefe, Dicke, Temperatur, Druck, Dichte, P-/S-Wellen, Zähigkeit, Anteil an Volumen und Masse, Gesteine, Minerale, Grenzen
      - Schale für Schale abziehen bis zum inneren Kern; Außenschichten wahlweise überhöht
      - Einfärben nach Schichten, Temperatur, Dichte oder fest/flüssig; Beschriftungen und Quiz »Schichten finden«
      - Mantelkonvektion live auf den Schnittflächen (Stokes-Löser)
      - Tiefenprofil nach PREM — Temperatur mit Schmelzkurve, Druck, Dichte, Wellen, Zähigkeit (log, mit Vergleichsstoffen), Schwere; Ablesen per Maus
      - Erdbebenwellen: Strahlenverfolgung durch die Kugel, P- und S-Schatten, Laufzeit-Animation, drei Erdmodelle (homogen, flüssiger Kern, fester Innenkern)
      - Konvektionslöser zum Ausprobieren: Zähigkeit/Rayleigh-Zahl, Heizung durch Kern und Radioaktivität, Kontinent als Deckel, heiße und kalte Flecken setzen; Strömung in cm/Jahr und Wärmetransport
      - Wissensteil: Zusammensetzung, Woher wissen wir das, Wärmequellen, Geodynamo, Schichttabelle, Quellen
  - id: wilson
    name: Wilson-Zyklus
    kann:
      - Querschnitt eines ganzen Zyklus (560 Mio. Jahre) im Zeitraffer oder per Schieber, Phasenleiste zum Springen
      - Superkontinent mit Plume, Grabenbruch mit Abschiebungen und Grabensee, junges Meer, Ozean mit Rücken, Subduktion, Schließen, Kollision, Abtragung
      - Meeresbodenstreifen mit Magnetrichtung, Alter, Tiefe und Lithosphärendicke nach Alter; passive Ränder mit Schelf und Sedimenten
      - Abtauchende Platte bis 660 km, Tiefseerinne, Vulkanbogen mit Magma, Abriss nach der Kollision
      - Gebirge und Gebirgswurzel nach Isostasie, Sutur, Rumpfgebirge
      - Mantelströmung, Erdbeben (Graben, Rücken, Benioff-Zone, Kollision), Plattengeschwindigkeiten
      - Phasenkarten mit heutigem Beispiel, Plattengrenzen und Begriffen; Quiz »Welche Phase?«
      - Wissensteil: Tuzo Wilson, Superkontinente, Wilson-Zyklen in Deutschland, Antrieb der Platten, Beweise, Quellen
  - id: schichten
    name: Schichtenmodell
    kann:
      - Ein Foto reist von Erfurt nach Tokio durch alle Schichten (Idee rick.theengineer, Instagram), OSI oder TCP/IP umschaltbar; Lenas App heißt PurrMsg
      - Drei Niveaus — Einsteiger (ab Kl. 6, einfache Sprache, Umschlag-Bild), Fortgeschritten, Experte (Prüfsummen von Hand, Krypto/RFC-Details)
      - Vom Bild zu den Zahlen — Pixel-Regler, RGB und Hex mit Rechenweg, Rohgröße gegen JPEG, JPEG-Kopf und Quantisierungstabelle
      - Arbeitsauftrag und »Wissen dazu« in jeder Missionsstufe, Hilfen je Niveau
      - Binär-Rechner als Hilfsmittel in Bits und Routing (mit Zielzahl; kostet 100 Punkte und einen Stern)
      - Punkte (bis 1000 je Stufe, Niveau-Faktor), Sterne, Punktestand, 12 Erfolge im Browser gespeichert
      - 3D-Schichtstapel mit 15 Schritten; echte Bytes für DNS, HTTP, JPEG, TLS 1.3 (ChaCha20-Poly1305), TCP, IPv4, Ethernet (CRC-32), Bits und Signal
      - Hex-Bild der Kapselung in Schichtfarben, Feld antippen markiert Bytes; Auspacken und Prüfen in Tokio
      - Eigenes Foto (bleibt im Browser) oder eigener Text
      - Karte Hop für Hop mit Seekabeln, Laufzeiten, NAT, TTL und neuen MAC-Adressen je Strecke
      - TCP bei Paketverlust (Fast Retransmit, Timeout) als Ablaufdiagramm
      - Mission zum Selbermachen — Wort → ASCII → Bits → DNS-Jagd → Felder füllen → Routing mit längstem Präfix (23 Router, acht Empfänger, Köder in den Tabellen)
      - Fehlersuche mit 13 Fällen und Windows-Werkzeugen (ipconfig, ping, nslookup, tracert)
      - Als TaskCrawler-Werkzeug mit festem Reiter und Modell
  - id: dla
    name: Fraktales Wachstum
    kann:
      - Diffusionsbegrenzte Aggregation (Vorbild dlaf von Michael Fogleman, MIT) live im Browser, Farbe nach Reihenfolge des Anwachsens
      - Fläche (2D) bis 250 000 Teilchen als Äste oder Punkte, Raum (3D) bis 500 000 als drehbare Punktwolke
      - Haftwahrscheinlichkeit, Keim Punkt/Linie/Kreis, PNG-Export
      - Neun Farbverläufe (Ozean, Viridis, Magma, Feuer, Eis, Koralle, Wald, Regenbogen, Weiß), umschaltbar ohne Neuwachsen
      - Fraktale Dimension per Masse-Radius-Methode live im log-log-Diagramm mit Vergleichsgeraden
      - Zeitlupe eines einzelnen Wanderers mit Spur und Fangkreis, Erklärung mit Beispielen aus Natur und Technik
      - Als TaskCrawler-Werkzeug mit festem Reiter
  - id: pse
    name: Periodensystem
    kann:
      - Alle 118 Elemente im Raster, nach Kategorie eingefärbt, Lanthanoide und Actinoide ausgerückt
      - Suche über deutschen Namen, Symbol oder Ordnungszahl; Filter je Kategorie
      - Steckbrief mit Foto der Stoffprobe (Wikimedia Commons, Urheber und Lizenz am Bild)
      - Kenndaten von PubChem (NCBI, gemeinfrei) - Masse, Zustand, Schmelz-/Siedepunkt in °C, Dichte, Elektronegativität, Konfiguration, Oxidationszahlen, Entdeckung
      - Kurztext zu Wesen, Vorkommen und Verwendung bei den Schulelementen
      - Typische Reaktionen unausgeglichen, Klick öffnet die Gleichungswaage im Chemiemodus (?reaktion=…)
      - Hauptgruppennamen (Alkalimetalle, Erdalkalimetalle, Borgruppe, Kohlenstoffgruppe, Stickstoffgruppe, Chalkogene, Halogene, Edelgase) im Steckbrief
      - PSE-Rallye: sechs Fragearten (Ordnungszahl, Atommasse, Name, Symbol, Hauptgruppe, Periode×Hauptgruppe), Antwort per Klick ins Raster, drei Bereiche
      - Punkte (3/2/1 je nach Versuch), bis zu drei Sterne je Runde, 19 Erfolge in vier Gruppen; Stand im Browser (ohne Konto spielbar)
      - Bilder und Daten liegen im Repo (offline, nichts geht nach außen); geholt mit scripts/fetch-pse.mjs
  - id: strukturformeln
    name: Strukturformeln
    kann:
      - IUPAC-Name eintippen, Strukturformel entsteht beim Tippen (Parser und Layout eigener Code, Vorbild strukturformelzeichner.de)
      - Alkane, Alkene, Alkine (auch mehrfach), Ringe, Halogenalkane, Alkohole, Aldehyde, Ketone, Carbonsäuren, Ester, Amine
      - Reste als Vorsilben (2,3-Dimethylbutan) und Trivialnamen (Benzol, Essigsäure, Aceton, Glycerin)
      - Vier Darstellungen: Valenzstrich gerade (Schulform, Hauptkette waagerecht, Abzweigungen senkrecht), Valenzstrich mit 120°-Winkeln, Skelettformel, Kugel-Stab-Modell in 3D
      - 3D-Modell zum Drehen und Zoomen (three.js, lazy): Winkel nach VSEPR (Tetraeder 109,5°, Dreieck 120°, Gerade 180°), Benzol flach, Cyclohexan gewellt, PNG-Export
      - Alle H-Atome, freie Elektronenpaare; Striche enden am Schriftkasten, keine Linie laeuft durch einen Buchstaben
      - Drehen, spiegeln und als SVG speichern
      - Summenformel (Hill), molare Masse und Zahl der C-Atome; H-Atome aus der Bindigkeit gerechnet
      - Als TaskCrawler-Werkzeug mit festem Namen
  - id: wfc
    name: Wellenfunktionskollaps
    kann:
      - Wave Function Collapse (nach github.com/mxgmn/WaveFunctionCollapse, MIT) Schritt für Schritt mit Mischfarben, Anzahl der Möglichkeiten, Tempo bis »super langsam«
      - Simple Tiled Model: Landschaft (Ecken-Kacheln), Straßen & Flüsse mit Brücken, Rohre — Drehungen automatisch
      - Overlapping Model aus selbst malbarer Vorlage (Höhlen, Ziegelmauer, Wege, Inseln, Stadtplan), 2×2/3×3, Symmetrie wählbar
      - Randbedingungen: Zellen oder Rand festlegen, Widerspruch → Neustart mit neuem Zufall, unmögliche Festlegungen gemeldet
      - Reiter Textur: Textur-Synthese nach Harrison (portiert aus github.com/mxgmn/TextureSynthesis, MIT) zum Zuschauen, nahtlos, Proben aus den Gebäude-Oberflächen und Pixel-Vorlagen; erzeugt auch die Fels/Erde/Sand/Eis-Texturen der Gebäude
      - Als TaskCrawler-Werkzeug mit festem Reiter/Satz/Vorlage/Probe
  - id: algo
    name: Algorithmen-Werkstatt
    kann:
      - "Reiter Automat: vier Automaten (Kaugummi, Pfand, Fahrkarte, Kakao), Handlungskarten ordnen, Robo oder Alien Zorp führen sie wörtlich aus"
      - "Jede Falle zeigt eine Algorithmus-Eigenschaft: nicht eindeutig, nicht ausführbar, nicht endlich, falsche Reihenfolge; Automat B prüft »allgemein gültig«"
      - Notizfeld »Erst selbst aufschreiben« und Ordnungsaufgabe »Was macht der Automat?« mit Sprung ins Flussdiagramm
      - "Reiter Flussdiagramm: Editor mit Start/Ende, Ein-/Ausgabe, Anweisung, Entscheidung; Ziehen, Pfeile, ja/nein; Prüfung inkl. Endlosschleifen"
      - "Rechnender Ablauf Schritt für Schritt: eingabe T, x = 3*T + M, ausgabe r, Vergleiche in Rauten"
      - "Sieben Aufgaben: Formen zuordnen, Pfeile setzen, Fehler finden, Ablauf verfolgen, Ist das ein Algorithmus?, Geburtstagsrechnung und Lexikon selbst bauen (automatisch geprüft)"
      - Neun Beispiele (Automaten, Automat von innen, Geburtstag, Lexikon, Zähneputzen, gerade/ungerade) und freies Zeichnen
      - "Reiter Code-Abenteuer: 31 Level in acht Welten — Direktsteuerung, Planen, Drehen, Schleifen, Bedingungen, Labyrinthe, Unterprogramme, Endgegner"
      - Vorhersage-Level (Endfeld anklicken), Fehlersuche mit vorgegebenem Programm, mehrere Karten je Level, Bausteingrenzen, Sterne für kurze Programme
      - "Editor: Blockly-Blöcke im Scratch-Look über die volle Breite unter dem Spielfeld; gezeigte Programme (Vorhersage, Hinweis, Vorführen) als Puzzleteile; Programm als Flussdiagramm ansehen"
      - "Vier Themen: Bug-Jagd (Cyberpunk), Verlies-Abenteuer, Mars-Mission, Labyrinthien (Mampfi)"
      - Duell zu zweit an einem Gerät mit Zugprotokoll
      - "Sterne und Punkte überall: Bausteine, Fehlversuche und ein kleiner Zeitanteil (Zeit nur bei sichtbarer Seite); Vorführen halbiert die Punkte"
      - "Unscharfe Hilfe (Fuzzy-Logik aus Fehlversuchen, Zeit, Untätigkeit): Tipp → konkreter Hinweis → Vorführen; Hilfsmodus mit doppelter Richtzeit"
      - Radar-Anzeige beim Einsammeln und bei Sensor-Prüfungen; Bedingung »Gegner in der Nähe« (Feld vorne oder daneben)
      - "Welt 8: Viren auf Streifen kreuzen den Weg (8-2 Virenschleuse, 8-3 Datenstrom), 8-4 Jäger-Virus folgt der Figur auf dem kürzesten Weg mit halber Geschwindigkeit"
      - "Vorhersage-Level mit zweiter Frage »Was passiert am Ende?« — Programme enden auch vor dem Ziel, an der Wand oder mit Scan ins Leere"
      - Klassenübersicht für die Lehrkraft (Automaten, Aufgaben, Sterne je Level), Gäste über den Code
  - id: regeln
    name: Regel-Labor
    kann:
      - Ersetzungsregeln auf einem Raster (nach MarkovJunior), automatisch in allen vier Richtungen, mit Joker
      - Blöcke »eins«, »markov« (Vorrang) und »alle«, Schrittgrenzen, Programme aus mehreren Blöcken
      - Editor als Farbkästchen oder als Text; Zähler je Regel, Treffer-Anzeige (mögliche und eben ersetzte Stellen)
      - Lehrgang in fünf Stationen vom Zufallslauf über den Backtracker bis zum Grundriss mit Zimmern und Türen
      - Rätsel mit Regel-Limit und automatischer Prüfung (Schachbrett, Punktgitter, perfektes Labyrinth …)
      - Gleicher Zufall liefert das gleiche Bild — Ergebnisse lassen sich in der Klasse vergleichen
      - Labyrinth-Algorithmen Schritt für Schritt: Backtracker, Prim, Kruskal, Wilson; Löser Tiefensuche, Breitensuche, A* mit sichtbarem Stapel/Schlange/offener Liste und Vergleichstabelle; Rundwege per »Wände einreißen«
      - Beispielgalerie mit Vorschaubildern: Labyrinth, Blumen, Höhle (aus MarkovJunior), Platine, Verlies, Game of Life — alle im Editor veränderbar
      - 34 weitere MarkovJunior-Beispiele per Auswahlliste, automatisch übertragen (scripts/mj-beispiele.py), mit Link aufs Original; Quellen: github.com/mxgmn/MarkovJunior, instagram.com/index.opensource
      - Tempo von »super langsam« bis »sofort«; Programm-Schrittgrenze »grenze N«
      - Weitere Bausteine: Symmetrie je Block (gedreht & gespiegelt / nur gespiegelt / fest), gleichrangige Regeln in markov, Chance je Treffer, Pfad (kürzester Weg, mit Abstand), Nachbarn (Zellautomat)
      - Gebäude aus einer Wachstumsregel (WBB=WAW): Stockwerke in 3D zum Durchlaufen, daneben der Grundriss als Raster; Grundlage der TaskCrawler-Gebäudeansicht
      - Ganzes Haus als drehbares Modell (alle Stockwerke, Treppen, Stützen, Sockel) in 17 Stilen (Klassisch, Beton, Glas & Neon, Gartenpalast, Verlies, Burg, Holzhütte, Eispalast, Wüstentempel, Raumstation, Lavahöhle, Steinzeithöhle, Antiker Tempel, Mittelalter, Gotik, Viktorianisch, Retro)
  - id: verkehr
    name: GTA – Ganztagsaufmerksamkeit im Verkehr – zu Fuß
    kann:
      - Echte Karte um die Schule (OpenStreetMap, 750 m)
      - Zu Fuß laufen in GTA-artiger Draufsicht (Pfeile/WASD)
      - Anzeige des Untergrunds (Gehweg, Radweg, Fahrbahn, Gleis)
      - Ampeln (Kreuzungen im Umlauf, Fußgängerampel mit Taster) und Autos
      - Regelprüfung beim Queren (Rot, Umschauen, Umweg, Bummeln, Radweg, Gleis)
      - Bus, Straßenbahn und Zug mit Türen (aussteigen lassen, seitlich warten, mit E einsteigen, im Bus X = Haltewunsch)
      - Busse auf dem echten Linienweg aus OSM, Halt nur an den Steigen ihrer Richtung
      - Zoomstufen (+ / − oder Mausrad); Ampeln gelten nur für ihre eigene Straße
      - Bus-Szene: Bus ohne Dach ganz nah, Zonen wie im Schaubild, Fahrgäste mit Gedränge und Zurufen, Sitze/Vorrangsitze, Kinderwagen, Rollstuhl mit Rampe, Festhalten beim Bremsen, Rucksack (B)
      - Zwei Bustypen: Stadtbus und »Schlenky« (Gelenkbus mit Drehgelenk, zwei Flächen für Kinderwagen/Rollstuhl); Linie 9 fährt Schlenky
      - Busse nach Fahrplan (pünktlich am Halt), Abfahrtstafel nur mit der Richtung des Steigs
      - Zeitraffer beschleunigt die ganze Stadt (Laufen, Autos, Ampeln, Bahnen)
      - Handy Sim: Karten-App mit Suche (Adressen aus OSM), Fußweg-Route in Handy und Stadt, 2× Beamen je Sitzung
      - Fahrrad: fünf Modelle, Werkstatt-Spiel (Checkliste prüfen, mit dem richtigen Werkzeug reparieren, Sterne nach Zeit und Fehlern), Prüfung nach StVZO (§§ 64a, 65, 67), Schloss, Abstellen am Ständer (OSM) oder frei, Diebstahl
      - Radregeln: Radweg bzw. Fahrbahn ohne Radweg = Karma, Gehweg nur bis 10, rechts fahren, Einbahn, Zebrastreifen, Rot, Licht; Rad in Bus/Bahn nur auf der Mehrzweckfläche, Karma fürs Platzmachen
      - Radwege nach Schild aus OSM: Radweg (237), gemeinsam (240), getrennt (241), Gehweg »Radfahrer frei« (Schritttempo); Benutzungspflicht; Klingel
      - Vorfahrt an rund 1300 Kreuzungen: Ampel, Vorfahrtstraße/Vorfahrt gewähren (aus der Straßenart abgeleitet, Schilder 205/306), Stopp, rechts vor links; anhalten, schauen, vorlassen
      - Passanten auf den Gehwegen: warten am Bordstein, weichen beim Klingeln aus, schimpfen bei zu dichtem Vorbeifahren
      - Aussehen: Oberteil, Mütze, Rucksack (mit Farbwahl), Handy (Android +10 / Apple −10 Karma)
      - Polizei-Gespräch (nett/grummelig, Frau/Mann) mit Antwortwahl, Stufen bis Wache + Eltern + Bußgeld
      - LTB als Tux (Larry Ewing, The GIMP)
      - Karte bis in die Innenstadt (Anger, Domplatz, Hauptbahnhof), rund 2 × 3 km
      - Straßenbahnen 1–6 auf den echten Gleisen (Tramlink, 42 m, 7 Türen), nach EVAG-CityTakt, mit Szene wie im Bus; Mittelbahnsteige
      - Stadt- und Regionalbusse der Innenstadt nach Takt
      - Wegsuche wie in Diablo 2 (Klick: um Häuser herum, über Gehwege und Überwege); mehrspurige Straßen mit Autos nebeneinander
      - Gemeinsame Live-Stadt für die Klasse, Lehrkraft-Übersicht
      - Gesten mit Emoji-Blase, Schimpfen mit Polizei (abschaltbar)
      - Aufträge, Schilder-Rallye, Gruppe als Wand, Fußgänger-Führerschein mit Hauspunkten
      - Start vor der Schule, Uhrzeit mit Berufsverkehr, Dämmerung und Nacht (Warnweste)
      - Echte Linien (Bus 9, 35, Tram 1, 5); Bus 9 mit echtem EVAG-Fahrplan, sonst nach Takt
      - Maussteuerung wie Diablo (klicken/halten), Ampelphase 30 s, Schultor und Schulhof-Einfahrt
      - Spielstraße um die Schule aus OSM (»Kiss and Ride Zone«), dazu Tore, Überweg und Spielplatz als Ergänzung; Elterntaxis 7:30–8:15
      - Überblick mit Straßennamen und Minikarte, Vollbild, Stick-Steuerung am Handy
      - Geräusche (Web Audio), 22 Erfolge und Statistik
      - LTB, der Pinguin-Begleiter mit Begrüßung und Sicherheitstipps; fragen mit L oder Klick auf ihn (Tipp passend zum Ort)
      - Zeitraffer ×2/×5/×10 oder stufenlos bis ×10 (Lehrkraft für alle)
      - Müll aufheben und einwerfen für Punkte und Karma (nie auf der Fahrbahn bücken)
  - id: tippen
    name: Tippen (10-Finger-Trainer)
    faehigkeiten: {use: [true, true], host: [true, false], upload: [true, false]}
    kann:
      - Bildschirmtastatur mit Fingerfarben, neun Lektionsstufen
      - Fehlersperre ohne Rücktaste
      - Modi Lektionen, Wortregen, Tastenjagd, Wettschreiben (Klassenrennen)
      - Anschläge pro Minute, Fehlerquote, schwächste Tasten
      - Bestenliste mit den besten hundert je Modus
      - Eigene Texte per JSON, nachträglich per Formular bearbeitbar
  - id: maus
    name: Maus-Führerschein
    faehigkeiten: {use: [true, true]}
    kann:
      - PC-Grundkurs in drei Teilen (Maus / Tastatur, Dateien, Fenster, Speichern / Suchen, Apps, Bildschirmfoto, Aussehen)
      - Nachgebautes Windows mit Explorer, Fenstern, Editor mit Speichern-unter, USB-Stick, Herunterfahren, Bildschirmfoto
      - Tastenkappen im Aufgabentext mit Tastatur beim Draufzeigen
      - Vorführen, Vorlesen, 1 bis 3 Sterne je Stufe, Hilfsmodus
      - Prüfung je Teil mit 5 Hauspunkten beim ersten Bestehen, Urkunde als Bild und PDF
      - Klassenübersicht und Bestenlisten
  - id: rechenregeln
    name: Rechenregeln
    kann:
      - Punkt vor Strich am Obstkorb
      - Vertauschungsgesetz am Rechenzug
      - Stufenzahlen und Kommaverschiebung an der Stellenwerttafel
      - Schrittweise lösen, Aufgaben würfeln, eigene Terme, Punktestand

