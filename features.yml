      - "Spiel »Wer fasst mehr?«: größeres Volumen antippen, Messbecher füllen sich; 60 s, Serienbonus, Rekord im Browser"
      - "Spiel »Renovieren«: Raum als Netz, streichen/tapezieren/fliesen mit Fenstern und Türen je Wand, Boden zuschaltbar; Fläche bzw. Tapetenbahnen rechnen, einkaufen, Punkte für Rechnung, Reichen und Preis; freier Planer"
      - "Spiel »Füllen«: Pool, Rundpool, Sprungbecken mit schrägem Boden, Ballon, Luftmatratze — schätzen (Auswahl), genau rechnen, Kopfsprung (Flachköpper/Land unter) bzw. Aufpumpen (schlapp/prall/Peng)"
  - id: stellenwert
    name: Stellenwerttafeln
    faehigkeiten: {use: [true, true]}
    kann:
      - Stellenwerttafel für Zehner-, Zweier- und Sechzehnersystem mit Plättchen oder Ziffern
      - Mehrere Zahlen als Zeilen untereinander in der Stellenwerttafel, per Häkchen auswählen und löschen
      - Bündeln und Entbündeln automatisch oder von Hand
      - Zehnersystem bis Milliarden, umschaltbar mit Kommastellen bis Tausendstel
      - Dieselbe Zahl in allen drei Systemen, Bits farbig in Vierer-Päckchen
      - Umrechnen Schritt für Schritt (Stellenwerte abziehen, Division mit Rest, Ziffer mal Stellenwert)
      - Zählwerk mit sichtbarem Übertrag
      - Übungen in drei Stufen mit Lösungsweg (Ablesen, Ziffernwert, Zahlwort, Zerlegen, Umrechnen, Weiterzählen)
      - "Spiele: Bit-Fall, Zählwerk-Rennen, Geheimbotschaft (ASCII)"
      - "Zählwerk-Rennen: Antwort durch Drehen der Walzen, Übertrag auf Wunsch automatisch und Walze für Walze"
      - "Zählwerk-Rennen auf Zeit oder mit fester Aufgabenzahl; im Zehnersystem Schritte in Stellenwerten (+ 1 H) bis 1 000, 1 Million oder 1 Milliarde"
      - "Geheimbotschaft: Code direkt an Anwesende derselben Sitzung schicken, Empfänger nimmt an, höchstens eine Botschaft je 3 Minuten"
  - id: farbmodelle
    name: Farbmodelle
    faehigkeiten: {use: [true, true]}
    kann:
      - "RGB als additive Lichtmischung, CMYK als subtraktive Druckmischung, HSV und HSL mit Farbkreis und Ziehfeld"
      - Dieselbe Farbe in allen Schreibweisen (Hex mit Kurzform, rgb(), Prozent, CMYK, HSV, hsl(), Grauwert, Gegenfarbe)
      - Farbcode Hex ↔ Dezimal je Kanal mit Rechenweg in beide Richtungen
      - Freier Umrechner Hex ↔ Dezimal mit Stellenwerten und fortgesetzter Division
      - "Spiel Hex-Farbmischer: Zielfarbe in drei Stufen nachmischen, Sterne, Tipp kostet einen Stern"
  - id: rechenregeln
    name: Rechenregeln
    kann:
      - Punkt vor Strich am Obstkorb
      - Vertauschungsgesetz am Rechenzug
      - Stufenzahlen und Kommaverschiebung an der Stellenwerttafel
      - Schrittweise lösen, Aufgaben würfeln, eigene Terme, Punktestand

tools:
  - id: schreibraum
    name: Schreibraum
    faehigkeiten: {use: [true, false], create: [true, false]}
    kann:
      - Gemeinsam schreiben in Echtzeit (WebSocket)
      - Modi nächste freie Zeile, Zeile hinzufügen, Wortstaffel
      - Dauerhafte oder temporäre Räume
  - id: barometer
    name: Umfrage
    faehigkeiten: {use: [true, false], host: [true, false]}
    kann:
      - Skala, Smiley-Skala, Auswahl, Mehrfachauswahl, Zahl, Freitext, Aussagen-Blöcke
      - Live oder zum Selbstausfüllen, Folien, Folgefragen
      - Diagrammart je Frage, JSON-Export, öffentliche Ergebnisseite per QR
      - KI-Auswertung der Freitexte über externe KI
      - Mit Kolleginnen und Kollegen teilen
  - id: exit-ticket
    name: Exit Ticket
    faehigkeiten: {use: [true, false], host: [true, false]}
    kann:
      - Anonymes Stundenfeedback mit Frage und optional 1 bis 5 Sternen
  - id: auktion
    name: Auktion
    faehigkeiten: {use: [true, false], host: [true, false]}
    kann:
      - Haussprecher bieten mit Hauspunkten auf Items
      - Phasen wartend, offen, abgeschlossen
  - id: classroom
    name: Classroom Screen
    faehigkeiten: {use: [true, false]}
    kann:
      - Widgets Uhr, Timer, Stoppuhr, Arbeitsform, Notizen
      - Frei anordnen, Layout im Browser gespeichert
  - id: stundenplaner
    name: Stundenplaner
    faehigkeiten: {use: [true, false], create: [true, false]}
    kann:
      - Verlaufsplanungen mit Phasen (Inhalt, Methode, Material)
      - Materialien anhängen, Office-Dateien zusätzlich als PDF
      - JSON-Import, teilen
      - Methoden aus dem Kompendium je Phase verknüpfen
      - Werkzeug je Phase einbinden: Spiele, Simulationen, Fragmente (auch einzelne Karte oder Clipping), Links
      - Export als PDF, Word, LaTeX mit Inhaltsverzeichnis und Quellen
      - Spielinhalte im Export mit Aufgaben, Lösungen und DDA-Differenzierung
  - id: kompendium
    name: Methoden-Kompendium
    faehigkeiten: {use: [true, false]}
    kann:
      - Methoden aus Didaktik, Pädagogik, Psychologie für Einstieg, Hauptteil, Abschluss
      - Filter nach Setting, Zielgruppe, Anwendungsgebiet, Evidenz, Qualifikation
      - Grundlagenkapitel, Grafiken, Mythen-Check, Quellen mit DOI
      - Markieren als Favorit, Einarbeiten, Brauch ich nicht (im Konto gespeichert)
      - Download als eigenständige Offline-HTML
  - id: curriculum
    name: Curriculinator
    faehigkeiten: {use: [true, false]}
    kann:
      - Schulinternes Curriculum (G/R/H/LB/GE, Wochen je Thema) gegen alten und neuen Lehrplan
      - Karten je Lehrplanpunkt, Abgleich identisch/geändert/verschoben/neu/entfällt mit Wort-Diff
      - Konflikte am Thema, offene neue Inhalte je Klassenblock, Wochensumme je Klasse
      - Themen per Ziehen zwischen Klassen verschieben, Karten zuordnen, fehlende Niveaus ergänzen
      - KI-Prompt für Lehrplanvergleich und Zuordnung, JSON-Vorlage hoch- und herunterladen
      - Material an Einheiten und Karten: Simulationen, Werkzeuge, Fragmente, Links
      - Export der Endfassung als DOCX, PDF (alle Klassen oder eine) und SVG je Klasse
      - gemeinsamer Stand der Fachschaft, Gastbeitritt per QR
  - id: snap
    name: Snap!
    faehigkeiten: {use: [true, false], create: [true, false]}
    kann:
      - Snap! komplett lokal, ohne Internet und Konto
      - Programme in TT speichern
      - Lehrkraft-Programme als Klassenvorlagen
  - id: standalone
    name: Offline-Dateien
    kann:
      - Werkzeuge als einzelne HTML-Datei herunterladen, nur mit Freigabe für das Werkzeug

sport:
  - id: wettkampf
    name: Wettkämpfe
    faehigkeiten: {use: [true, false], create: [true, false]}
    kann:
      - K.-o., Jeder gegen Jeden, Paarungsturnier
      - Wertung, Punkte und Rangfolge einstellbar
      - Teilnehmende aus Klassen, Schülern, freien Namen oder Lehrerteams
  - id: sportfest
    name: Sportfest
    faehigkeiten: {use: [true, false], create: [true, false]}
    kann:
      - Sprint, Ausdauer, Weitsprung, Ballwurf nach DLV-Tabellen
      - Ergebnisse je Klasse, Gesamt- und Disziplinranking

verwaltung:
  - id: fragmente
    name: Fragmente
    faehigkeiten: {use: [true, true], create: [true, false]}
    kann:
      - Pinnwände mit Textfragmenten und Recherche-Clips samt Link-Vorschau
      - Zugriff je Sammlung (lesen, beitragen, verwalten) für Lehrkräfte, Klassen, A/B-Gruppen
      - Gastbeitritt per QR, Tabs
  - id: klassenverwaltung
    name: Klassenverwaltung
    kann:
      - Häuser mit Name, Farbe, Logo, Klassen zuordnen
      - Rollen (Klassen-, Schüler-, Haussprecher, eigene)
      - Dienste von Hand oder zufällig verteilen
      - Checklisten je Schüler für Klassen und Gruppen
      - Kurse, Wahlpflicht, A/B-Gruppen
      - Werkzeug-Freigaben je Klasse durch die Klassenlehrkraft
      - Klassenbezeichnungen rücken zum 1. August von selbst weiter (7a → 8a)
      - Stabile Abschlussjahrgangs-Codes (z. B. AK2031a)
  - id: sitzplan
    name: Sitzplan
    kann:
      - Mehrere Räume je Klasse, Editor auf Zeichenfläche
      - Export als A4-PDF, auch für Kurse
  - id: kalender
    name: Kalender
    kann:
      - Einzeltermine und Zeiträume im Schuljahr
      - Sichtbarkeit nach Zielgruppe, persönliche Einträge
      - Farbige Tags, Ferien nach Bundesland
      - ICS-Import und -Export
  - id: slideshow
    name: Startseiten-Slideshow
    kann:
      - Bilder, PDFs, Videos, Links, Termine, Wochenspruch, Hauspunkte, Uhr
      - Zeitfenster zum Festheften, Inhalte je Zielgruppe
      - Dateien ersetzen, Einstellungen bleiben
      - Warnungen bei kaputten oder überlappenden Einträgen

admin:
  - {id: schuelerdaten, name: Schülerdaten, kann: [CSV-Import mit Diff, Zugänge generieren, Export]}
  - {id: lehrerdaten, name: Lehrerdaten, kann: [Konten und Lehrerrollen verwalten]}
  - {id: schuelerkarten, name: Schülerkarten, kann: [Felder und Klassen wählen, Drucklayout, PDF-Export]}
  - {id: freigaben, name: Werkzeug-Freigaben, kann: [Je Werkzeug, Fähigkeit und Zielgruppe erlauben oder sperren]}
  - {id: admin_rechte, name: Admin-Rechte, kann: [Admin-Bereiche an Lehrerrollen oder einzelne Lehrkräfte vergeben]}
  - {id: generatoren, name: Aufgaben-Generatoren, kann: [Eigene Übungsthemen deklarativ anlegen]}
  - {id: darstellung, name: Darstellung, kann: [Farbschema, Icon-Stil Fantasy/Cyberpunk/Emoji, Hell/Dunkel]}
  - {id: style_pack, name: Style Pack, kann: [ZIP mit Logo, Icons und Farben]}
  - {id: schuleinstellungen, name: Schuleinstellungen, kann: [Dauer des Gastzugangs, Anzeige von Schülerdaten]}
  - {id: quellen, name: Quellen und Lizenzen, kann: [Quellen nach Werkzeug, npm-Lizenzen aus node_modules, ungeklärte Rechte markiert]}

datenschutz_sicherheit:
  - Schülernamen außerhalb von Klassenleitung und Datenverwaltung nur als »Vorname N.«
  - Zwei-Faktor (TOTP) für Lehrkraft-Passwörter und Zugangsdaten-Export
  - bcrypt für Logins, Fernet-Verschlüsselung für druckbare Zugangsdaten
  - Audit-Log für sicherheitsrelevante Zugriffe, zehn Schuljahre aufbewahrt
  - Löschen der Spielsitzungen zum Schuljahreswechsel (1. August), Punkte bleiben
  - Kein ausführbarer Code in Uploads, SSRF-Schutz bei Link-Vorschauen
  - Keine KI in der App, nur Prompts für externe Werkzeuge

rollen:
  admin: Alles
  lehrkraft: Punkte, Werkzeuge hosten, Inhalte erstellen, Admin-Bereiche nur mit Freigabe
  klassenlehrkraft: Zusätzlich eigene Klasse bearbeiten, Zugangsdaten mit 2FA exportieren
  schueler: Aktivitäten, Simulationen, freigegebene Werkzeuge, gemeinsamer Schüler-Pool für Inhalte
  gast: Nur die gescannte Sitzung, zeitlich begrenzt
