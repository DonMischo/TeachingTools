      - Tiefenprofil nach PREM — Temperatur mit Schmelzkurve, Druck, Dichte, Wellen, Zähigkeit (log, mit Vergleichsstoffen), Schwere; Ablesen per Maus
      - Erdbebenwellen: Strahlenverfolgung durch die Kugel, P- und S-Schatten, Laufzeit-Animation, drei Erdmodelle (homogen, flüssiger Kern, fester Innenkern)
      - Konvektionslöser zum Ausprobieren: Zähigkeit/Rayleigh-Zahl, Heizung durch Kern und Radioaktivität, Kontinent als Deckel, heiße und kalte Flecken setzen; Strömung in cm/Jahr und Wärmetransport
      - Wissensteil: Zusammensetzung, Woher wissen wir das, Wärmequellen, Geodynamo, Schichttabelle, Quellen
  - id: wilson
    name: Wilson-Zyklus
    kann:
      - Querschnitt eines ganzen Zyklus (560 Mio. Jahre) im Zeitraffer oder per Schieber, Phasenleiste zum Springen
      - Superkontinent mit Plume, Grabenbruch mit Abschiebungen und Grabensee, junges Meer, Ozean mit Rücken, Subduktion, Schließen, Kollision, Abtragung
      - Meeresbodenstreifen mit Magnetrichtung, Alter, Tiefe und Lithosphärendicke nach Alter; passive Ränder mit Schelf und Sedimenten
      - Abtauchende Platte bis 660 km, Tiefseerinne, Vulkanbogen mit Magma, Abriss nach der Kollision
      - Gebirge und Gebirgswurzel nach Isostasie, Sutur, Rumpfgebirge
      - Mantelströmung, Erdbeben (Graben, Rücken, Benioff-Zone, Kollision), Plattengeschwindigkeiten
      - Phasenkarten mit heutigem Beispiel, Plattengrenzen und Begriffen; Quiz »Welche Phase?«
      - Wissensteil: Tuzo Wilson, Superkontinente, Wilson-Zyklen in Deutschland, Antrieb der Platten, Beweise, Quellen
  - id: schichten
    name: Schichtenmodell
    kann:
      - Ein Foto reist von Erfurt nach Tokio durch alle Schichten (Idee rick.theengineer, Instagram), OSI oder TCP/IP umschaltbar; Lenas App heißt PurrMsg
      - Drei Niveaus — Einsteiger (ab Kl. 6, einfache Sprache, Umschlag-Bild), Fortgeschritten, Experte (Prüfsummen von Hand, Krypto/RFC-Details)
      - Vom Bild zu den Zahlen — Pixel-Regler, RGB und Hex mit Rechenweg, Rohgröße gegen JPEG, JPEG-Kopf und Quantisierungstabelle
      - Arbeitsauftrag und »Wissen dazu« in jeder Missionsstufe, Hilfen je Niveau
      - Binär-Rechner als Hilfsmittel in Bits und Routing (mit Zielzahl; kostet 100 Punkte und einen Stern)
      - Punkte (bis 1000 je Stufe, Niveau-Faktor), Sterne, Punktestand, 12 Erfolge im Browser gespeichert
      - 3D-Schichtstapel mit 15 Schritten; echte Bytes für DNS, HTTP, JPEG, TLS 1.3 (ChaCha20-Poly1305), TCP, IPv4, Ethernet (CRC-32), Bits und Signal
      - Hex-Bild der Kapselung in Schichtfarben, Feld antippen markiert Bytes; Auspacken und Prüfen in Tokio
      - Eigenes Foto (bleibt im Browser) oder eigener Text
      - Karte Hop für Hop mit Seekabeln, Laufzeiten, NAT, TTL und neuen MAC-Adressen je Strecke
      - TCP bei Paketverlust (Fast Retransmit, Timeout) als Ablaufdiagramm
      - Mission zum Selbermachen — Wort → ASCII → Bits → DNS-Jagd → Felder füllen → Routing mit längstem Präfix (23 Router, acht Empfänger, Köder in den Tabellen)
      - Fehlersuche mit 13 Fällen und Windows-Werkzeugen (ipconfig, ping, nslookup, tracert)
      - Als TaskCrawler-Werkzeug mit festem Reiter und Modell
  - id: dla
    name: Fraktales Wachstum
    kann:
      - Diffusionsbegrenzte Aggregation (Vorbild dlaf von Michael Fogleman, MIT) live im Browser, Farbe nach Reihenfolge des Anwachsens
      - Fläche (2D) bis 250 000 Teilchen als Äste oder Punkte, Raum (3D) bis 500 000 als drehbare Punktwolke
      - Haftwahrscheinlichkeit, Keim Punkt/Linie/Kreis, PNG-Export
      - Neun Farbverläufe (Ozean, Viridis, Magma, Feuer, Eis, Koralle, Wald, Regenbogen, Weiß), umschaltbar ohne Neuwachsen
      - Fraktale Dimension per Masse-Radius-Methode live im log-log-Diagramm mit Vergleichsgeraden
      - Zeitlupe eines einzelnen Wanderers mit Spur und Fangkreis, Erklärung mit Beispielen aus Natur und Technik
      - Als TaskCrawler-Werkzeug mit festem Reiter
  - id: stadt
    name: Stadtentwicklung
    kann:
      - Acht Stadttypen auf demselben Zufallsgelände (5 Landschaften, Fluss mit Aue und Furt, Burgberg, Relief, Erosion auf Knopfdruck) - römisch, europäisch, amerikanisch, Residenzstadt, Festungsstadt, sozialistisch, lateinamerikanisch, orientalisch
      - Europäische Stadt bis um 2020 (Konversion, Gentrifizierung, Reurbanisierung); sozialistische Stadt mit Schrumpfung und Rückbau
      - Stadtstrukturmodelle als Schema (Burgess, Hoyt, Harris-Ullman, Lateinamerika, Orient)
      - Wachstum Epoche für Epoche mit Erklärung, »Neu in dieser Epoche« und Viertel-Legende
      - Quiz zur Karte — Bauwerke, Viertel und Straßen anklicken, Wissensfragen mit Begründung, Epoche erkennen
      - Sieben Planungsaufträge (auch Residenz- und Festungsstadt) mit Regelprüfung (✅/❌, Hinweis, Warum, Stelle in der Karte) und Beispiel-Lösung auf demselben Gelände
      - Sandkasten mit allen Werkzeugen, Viertel-Pinsel und optionaler Prüfung
      - Häuser entlang der Straßen je Viertel, Gassen und Vororte aus Tensorfeldern (Idee MapGenerator), alte Straßen per günstigstem Weg übers Gelände
      - Geländeinfo unter dem Mauszeiger (Höhe, Neigung, Aue, Abstand zum Wasser)
      - 3D-Flug im Stil von Voxel Space mit Fassaden, Fenstern, Satteldächern, Wäldern und eingebackenem Licht
      - Als TaskCrawler-Werkzeug mit festem Reiter und Stil
  - id: erosion
    name: Erosion
    kann:
      - Gitterbasierte Wassererosion mit Rutschungen nach terrain-erosion-3-ways (MIT), live Schritt für Schritt
      - Regler für Regen, Lösekraft, Standfestigkeit und Verdunstung
      - Ansichten Gelände, Wasser, Abtrag/Ablagerung, Vorher; stärkster Abtrag und Ablagerung in Metern
      - Gleiches Zufallsgelände wie die Stadtentwicklung, Delta an der Küste
      - Regen- und Trockenzeit, Zufluss am Oberlauf, neue Flüsse und Seen; Höhenschichten wie im Schulatlas (feste Meterstufen mit Legende), wahlweise 512²
      - Reiter Küste - Steilküste, Flachküste, Marsch mit Deich; Sturmflut, Meeresspiegelanstieg, Deichbruch, Querprofil; Verweis zur Küstendynamik und zurück
      - Reiter Gesteine & Verwitterung - Querschnitte (100 × 55 m) von neun Gesteinen mit Klüften und Schichten, Steckbriefe mit Beispielen aus Thüringen und Deutschland
      - Typische Formen je Gestein, beschriftet - Karst mit Ponor, Höhlenbach, Karstquelle, Trockental, Lösungs- und Einsturzdoline, Tropfsteinhöhle; Gipskarst mit Erdfall; Tafelberg, Schutthalden, Blockhalde, Hohlweg, Rutschung, Dünen
      - Granit - Wollsackverwitterung als abspielbare Erdgeschichte (Tertiär, Eiszeit, heute), Frost und Wasser auch in den Bankungsfugen, lose Blöcke rollen hangab
      - Karst aus einem unberührten, gehobenen Kalkrücken - Karstwasser-Netz (kürzeste Wege zu den Quellen, Lösung ∝ Durchfluss, Rückkopplung) lässt Röhren, Höhlen, Tropfsteine, Lösungsdolinen und Deckeneinbrüche entstehen; Wasserwege einblendbar, gelöste Menge als Zähler
      - Sechs Kräfte einzeln oder als Klima - Temperatur, Wind (Deflation, Dünen, Korrasion), Wasser (Abspülung, Versickern, Rutschung), Frostsprengung, Lösung und Hydrolyse (Karst, Höhlen, Tropfsteine, Grus), Pflanzen
      - Lupe - Ausschnitt 4× oder 8× feiner weiterrechnen (aus Klick oder erkannter Form), Sickerwasser von oben, kürzere Zeitschritte; Namen ein/aus am Bild
      - Hangrutschungen bei durchnässtem Lockermaterial an steilen Hängen; Gewässer am Rand fließen über den Talfluss ab, Erosionsbasis am Rand
      - Formen erkennen - entstandene Formen werden laufend gefunden und beschriftet (Höhle, Tropfsteinhöhle, Höhlenbach, Karstquelle, Schluckloch, Dolinen, Wollsack, Felsburg, Schutthalde, Düne; Küste - Kliff, Brandungsplatte, Anlandung, Deichbruch; Flüsse - See, neuer Fluss, Kerbtal, Schwemmfächer)
      - Wirkungsbalken zeigen, welche Kraft gerade am meisten verändert; Sonne, Wind, Regen, Schnee und Eis in Rissen sichtbar
      - 3D-Flug im Stil von Voxel Space
      - Als TaskCrawler-Werkzeug mit fester Ansicht
  - id: vulkan
    name: Vulkane
    kann:
      - Schildvulkan, Schichtvulkan und Hotspot (Hawaii) wachsen Ausbruch für Ausbruch; die Form entsteht aus SiO₂- und Gasgehalt des Magmas (auch Lavadom, Schlacken- und Aschekegel)
      - Ausbruch zum Zusehen als fallender Sand nach dem Vorbild von Sandspiel (MIT, neu geschrieben) - Eruptionssäule, Schirmwolke im Wind, Lapilli, Glutlawinen, Lavafontänen; Aschewolke auf der Karte
      - Hotspot - 320 km Ozean mit älterer Inselkette als Start, ortsfester Plume und Schlot, Nachschub in Schüben; neuer Vulkan wächst als Seamount, im Flachwasser surtseyanisch, dann als Insel; Absinken und Abtragung, Meer nach Tiefe gefärbt, Altersangaben
      - Unter Wasser - surtseyanische Dampfexplosionen im flachen Meer, keine Säule in der Tiefe, Kissenlava
      - Wissen - 21 Einträge zu Tephra, Ausbruchsarten, Lava und Gefahren mit Fakten, Fotos und Bezug zur Simulation; Legende führt hinein
      - Galerie »Echte Vulkane« - 57 Fotos von Wikimedia Commons (gemeinfrei, CC BY, CC BY-SA) mit Erklärung und Bildnachweis; Bildstreifen zum gewählten Typ
      - Lava als Bingham-Zellautomat (kritische Dicke, Zähigkeit steigt beim Abkühlen, Abstrahlung, schnelles Abkühlen im Meer)
      - Asche als Ring um den Krater und Windfahne, lockeres Material rutscht bis zum Schüttwinkel, Felsstürze an zu steilen Wänden
      - Flanken- und Spaltenausbrüche, Caldera-Einbruch mit Ignimbrit, Kraterseen, Vulkaninsel aus dem Meer
      - Querschnitt durch alle Schichten mit Schlot, Gängen, Magmakammer und Ringbrüchen, drehbar, höchstens 2,5-fach überhöht
      - Kennzahlen Höhe, Durchmesser, Hangneigung, Volumen, Ascheanteil; Karte mit verwitternden Lavaströmen, Beschriftungen und 3D-Flug
      - Als TaskCrawler-Werkzeug mit festem Typ (schild, schicht, hotspot) und Untergrund
  - id: stromkreis
    name: Stromkreise
    kann:
      - Schaltungen auf einem Raster bauen - Bauteile setzen oder aufziehen, Leitungen ziehen, verschieben (Leitungen wandern mit), drehen, löschen, Rückgängig
      - Batterie, Wechselspannung, Lämpchen, Widerstand, Motor, LED, Diode, Schalter, Umschalter, Sicherung, Kondensator, Spule, Trafo, Strom- und Spannungsmesser
      - Knotenpotenzialverfahren (MNA) mit Trapezregel für C, L und Trafo und Newton für Dioden; Durchbrennen, Sicherung löst aus, Motor mit Gegenspannung
      - Strompunkte in technischer Stromrichtung oder als Elektronen, Potenzialfarben, Zeitlupe, Effektivwerte bei Wechselstrom, Oszilloskop
      - Schaltplan mit DIN-Schaltzeichen oder realistische Ansicht wie im Experimentierkasten
      - 16 Beispielschaltungen; Speichern und Öffnen als JSON-Datei
      - Lehrkraft gibt Schaltung und Arbeitsauftrag an die Sitzung; Beitretende starten mit einer eigenen Kopie
  - id: baum
    name: Baumleben
    kann:
      - Lebenslauf eines Baumes vom Samen bis zum Humus für Rotbuche, Stieleiche, Fichte, Waldkiefer und Hänge-Birke; Standort, Boden und Niederschlag wählbar, Zeitleiste zum Abspielen und Springen
      - Zeitleiste durch alle Jahreszeiten (ein Jahr in 20 s) oder im Jahressprung, bei dem die gewählte Jahreszeit stehen bleibt; Tag und Nacht laufen auf eigener Uhr (Sonnenstand, Sterne, nachts keine Fotosynthese)
      - Darstellung natürlich (beleuchtete Krone, Borke, Himmel, Bodenhorizonte, Schnee, Nachbarbäume im Wald) oder als Schema
      - Prozedurales Wachstum - Laubbäume per Raumkolonisierung (Runions u. a. 2007), Nadelbäume als Quirle, Astdicke nach dem Pfeifenmodell, Knospenschicksal als Markow-Kette nach dem Licht, Blattstellung über den Goldenen Winkel, Selbstreinigung der unteren Äste
      - Wurzeln je Art als Pfahl-, Herz- oder Flachwurzel mit Senkern, Feinwurzeln und Mykorrhiza; Sämlinge zuerst mit Pfahlwurzel
      - Wasserhaushalt (Regen auf die Krone, Interzeption, Transpiration, Anteil der Fotosynthese), Nährsalze N P K Ca Mg, CO₂-Speicher und Gaswechsel als Modellwerte; Jahresringe mit Dürre- und Mastjahren
      - Bewohner je Lebensphase und Art in Krone, Stamm, Höhlen, Boden, Wurzelraum und Totholz
      - Stoffströme im Baum animiert (Xylem, Phloem, Nährsalze, Gase, Mykorrhiza) mit elf Erklärungen, Wasserpotential, Stammquerschnitt, Spaltöffnungs-Rechner
      - Fotosynthese für die Oberstufe - Blattquerschnitt, Chloroplast, Absorptions- und Wirkungsspektrum, Herbstfärbung, Lichtreaktion mit Z-Schema, Calvin-Zyklus, Einflussfaktoren, Wasserpest-Versuch, Quiz
      - 30 Bäume bestimmen mit Foto des ganzen Baums von Wikimedia Commons (Nachweis am Bild, dazu Nahaufnahmen), botanische Tafel im Steckbrief (meist gemeinfrei, Thomé/Sturm/Köhler), Blattschema mit Maßstab auf den Karten, Bestimmungsschlüssel und Quiz
      - Spiel »Sei ein Baum« nach dem Vorbild von Forest Shuffle mit fünf Standorten und dort typischen Arten, Ereigniskarten, Zuckerverteilung nach Lebensabschnitt (Sämling, Jungbaum, mannbar, Altbaum), Krüppelwuchs und frühem Tod, Gemeinschaften zwischen Bewohnern (z. B. Marienkäfer + Blattläuse) und Pflanzenkarten, Baumbild aus Raumkolonisierung und Markow-Knospen mit DLA-Wurzeln, Bewohnerkarten mit Larven, Raupen und Säugetieren, Totholz in sechs Zerfallsstufen mit je zwei Runden, zufällig Forst (Fällung mit der Umtriebszeit, danach nur Stubben) oder Naturwald mit Vergleichsstatistik (Lebensdauer, Biomasse, Totholz, Biodiversität, Arten-Jahre)
  - id: diagramme
    name: Diagramm-Werkstatt
    kann:
      - Ablaufdiagramme und Mindmaps in D2 (d2lang, MPL-2.0), gesetzt im Browser per WebAssembly
      - Pfeile per 🗑 beim Darüberfahren löschen; breite unsichtbare Trefferfläche um jede Verbindung
      - Bausteine-Modus - Knoten hinzufügen (Schritt, Start/Ende, Entscheidung, Ein-/Ausgabe), am gewählten Knoten weiterbauen, per Klick verbinden, Text, Form, Füll-/Rahmen-/Schriftfarbe, gestrichelt, fett, Pfeilart und Beschriftung
      - Code-Modus als Codeblock mit Syntaxfarben, Zeilennummern, Kopieren-Knopf, Fehlern mit Zeilenangabe und bebildertem Spickzettel für Schüler·innen; Bausteine und Code bearbeiten denselben Text, unbekannte D2-Teile bleiben unverändert
      - 20 Farbthemen, Richtung, Anordnung (dagre oder ELK), Handzeichnungs-Stil - im Code unter vars.d2-config
      - Prompt-Baukasten für KI-Chats (Mindmap, Ablaufdiagramm, frei; Thema, Stichworte, bisheriges Diagramm mitschicken) und Vorlage »Mit KI erstellen« mit demselben Auftrag als Kommentar; beim Einfügen wird nur der Codeblock der Antwort übernommen
      - Vorlagen (Mindmap, Ablaufdiagramm, Gruppen), Ablage im Browser, Rückgängig/Wiederholen, Export als PNG, SVG und .d2, .d2 öffnen
      - Übernimmt Diagramme aus anderen Werkzeugen als neues Blatt (localStorage hp_diagramm_import, z. B. KI-Kompass-Workflows)
  - id: erfolge
    name: Erfolge (Übersicht)
    kann:
      - Alle Erfolge aller Werkzeuge auf einer Seite (/erfolge), nach Werkzeug und Bereich geordnet
      - Fortschrittsbalken je Erfolg und Gesamtzahl; aufklappbar je Werkzeug
      - Sammelt die vorhandenen Erfolge ein (Sonnensystem, Schichtenmodell, Verkehr, Periodensystem)
      - Leitet Erfolge aus dem gespeicherten Fortschritt ab, wo ein Werkzeug keine führt (Algorithmen-Werkstatt, Koordinaten-Lauf, Regel-Labor)
      - Liest nur, schreibt nie; fasst Stände mehrerer Profile eines Geräts zusammen (je Erfolg der beste Wert)
  - id: pse
    name: Periodensystem
    kann:
      - Alle 118 Elemente im Raster, nach Kategorie eingefärbt, Lanthanoide und Actinoide ausgerückt
      - Feldaufbau wie im Tafelwerk: Ordnungszahl oben links, Atommasse oben rechts, Symbol mittig, Name, Elektronegativität und Dichte unten
      - Symbolfarbe = Aggregatzustand (fest/flüssig/gasförmig), * = radioaktiv; Perioden- und Gruppennummern am Rand, Legende unter dem Raster
      - Quadratische Felder, passen sich der Breite an (kein Rollbalken), Zoom 0,5–3× für die Projektion
      - Formeln korrekt gesetzt: Summenformeln und Reaktionen mit tiefgestellten Indizes, Elektronenkonfiguration mit Hochzahlen
      - Suche über deutschen Namen, Symbol oder Ordnungszahl; Filter je Kategorie
      - Steckbrief mit Foto der Stoffprobe (Wikimedia Commons, Urheber und Lizenz am Bild)
      - Kenndaten von PubChem (NCBI, gemeinfrei) - Masse, Zustand, Schmelz-/Siedepunkt in °C, Dichte, Elektronegativität, Konfiguration, Oxidationszahlen, Entdeckung
      - Kurztext zu Wesen, Vorkommen und Verwendung bei den Schulelementen
      - Typische Reaktionen unausgeglichen, Klick öffnet die Gleichungswaage im Chemiemodus (?reaktion=…)
      - Hauptgruppennamen (Alkalimetalle, Erdalkalimetalle, Borgruppe, Kohlenstoffgruppe, Stickstoffgruppe, Chalkogene, Halogene, Edelgase) im Steckbrief
      - PSE-Rallye: sechs Fragearten (Ordnungszahl, Atommasse, Name, Symbol, Hauptgruppe, Periode×Hauptgruppe), Antwort per Klick ins Raster, drei Bereiche
      - Punkte (3/2/1 je nach Versuch), bis zu drei Sterne je Runde, 19 Erfolge in vier Gruppen; Stand im Browser (ohne Konto spielbar)
      - Bilder und Daten liegen im Repo (offline, nichts geht nach außen); geholt mit scripts/fetch-pse.mjs
      - "Atommodelle: fünf Modelle in der Reihenfolge des Unterrichts — Teilchenmodell (Dalton), Kern-Hülle (Rutherford), Schalen (Bohr), Energiestufen (Bohr/Sommerfeld), Orbitale (Schrödinger); je Modell, was es erklärt und wo es aufhört"
      - Animierte Bilder (drehende Schalen, zitternder Kern, atmende Orbitale) per CSS, anhaltbar und mit Rücksicht auf »Bewegung reduzieren«
      - Bor im Mittelpunkt: drei Außenelektronen, Elektronensextett statt Oktett, daher die Gier nach einem fremden Elektronenpaar
      - "Bindungslabor: bis zu acht Atome zusammenstecken; geteilte Elektronenpaare pendeln zwischen den Schalen, je Atom steht die Elektronenbilanz mit Oktett-Prüfung dabei"
      - Zwölf Vorlagen (BF₃ bis CCl₄), Doppel- und Dreifachbindungen aus der übrigen Bindigkeit, Klartext-Hinweis, wenn eine Kombination nicht aufgeht
      - Elektronenkonfiguration aus den gemessenen PubChem-Daten, also mit den Ausnahmen (Chrom 3d⁵ 4s¹)
      - Elemente überall im gleichen quadratischen Feld (Raster, Legende, Steckbrief) aus einer Quelle gezeichnet
      - Reiter »Atommodelle« auch hier; dieselbe Ansicht gibt es als eigene Simulation
  - id: atommodelle
    name: Atommodelle
    kann:
      - "Eigene Simulation (/simulationen/atommodelle) mit vier Reitern: Atommodelle, Verbindungen, Lewis-Labor, Teilchenmodell — statt des großen Rasters ein kleines Periodensystem zum Auswählen; im Periodensystem bleibt der Reiter, wie er ist"
      - "Lewis-Labor: Elementsymbole mit ihren Außenelektronen als Punkte (erst je eins pro Seite, dann gepaart) frei zusammenschieben; nahe einzelne Elektronen drehen sich zueinander, zittern und ziehen die Atome wie Magnete an, dann springen sie als bindendes Paar in die Mitte — auch Doppel- und Dreifachbindungen nacheinander"
      - "Lewis-Labor: freie Paare weichen den Bindungen aus (Wasser gewinkelt), Elektronenzähler je Atom mit Oktett-/Duett-Haken, Molekülliste mit Summenformel und Name; schnelles Auseinanderziehen reißt die Bindung, Doppelklick entfernt, Schütteln, Valenzstriche einblendbar, 12 Bausätze"
      - "Lewis-Labor: Teilladungen δ+/δ− aus der Elektronegativität (polar ab ΔEN 0,5), das bindende Paar rückt zum elektronegativeren Partner"
      - "Lewis-Labor: 23 fertige Moleküle zum Einsetzen (×1/×3/×6), anorganisch (H₂O, NH₃, HF, HCl, CO₂ …) und organisch (Methan bis Butan, Ethen, Ethin, Methanol, Ethanol, Aceton, Essigsäure, Methylamin …), mit Siedepunkt in der Molekülliste"
      - "Lewis-Labor: Kräfte zwischen Molekülen als echte Kräfte mit Linien — Wasserstoffbrücken (H an N/O/F zum freien Paar), Dipol-Dipol, Van der Waals nach Größe der Hülle; Wärmebewegung als Regler; Vergleiche (Wasser, Methan, Ethanol, HCl, Gemische) zeigen, wer zusammenhält"
      - "Teilchenmodell: Temperaturregler von −273 bis 4000 °C (um 0 °C fein), getöntes Gefäß, Heizplatte mit Flammen bzw. Eis, Phasenleiste je Stoff zum Anklicken; 55 Stoffe (Metalle, Nichtmetalle, Verbindungen) mit echten Schmelz-/Siedepunkten, Sublimation (CO₂) und Zersetzung (Zucker, Kalk)"
      - "Teilchenmodell: fest = Teilchen am Gitterplatz, schwingen stärker je näher am Schmelzpunkt; Kristall wächst beim Erstarren von unten; flüssig = dicht und verschiebbar; gasförmig = schnell, füllen den Raum; Moleküle als Atomkugeln (CPK), Ionengitter abwechselnd"
      - "Teilchenmodell: Flüssigkeit kompakt und ungeordnet (Wärmebad aus Reibung und Zufallsstößen, kein Schwappen), bis 240 Teilchen; Brenner in der Mitte treibt nahe am Siedepunkt zwei Konvektionswalzen an, »Wärme zeigen« färbt die erwärmten Teilchen"
      - "Teilchenmodell: Umschalter Kugeln/Atome — Kugeln = Teilchenmodell der Schule, eine Kugelsorte je Stoff (eigene Farbe und Größe, auch bei Ionenverbindungen); Atome = Moleküle aus CPK-Kugeln"
      - "Mischen mit Trennwand: Gase diffundieren, gleich gebaute Flüssigkeiten mischen sich, Öl/Benzin schichten sich nach Dichte über Wasser, Salz und Zucker lösen sich bis zur Sättigung (Bodensatz), Iod in Benzin, Sand bleibt liegen; 10 Vorlagen"
      - "Reaktionen im Teilchenbild (11, von Knallgas über Eisen + Schwefel bis Kalkbrennen und Haber-Bosch mit Rückreaktion): Funke oder Heizen über die Starttemperatur, Wärme pflanzt sich als Flammenfront fort; Atombilanz vorher/nachher zeigt die Massenerhaltung"
      - "Fünf Modelle nacheinander: Teilchen (Dalton), Kern-Hülle (Rutherford), Schalen (Bohr), Energiestufen (Bohr/Sommerfeld), Orbitale (Schrödinger); je Modell, was es erklärt und wo es aufhört"
      - Animiert per CSS (drehende Schalen, zitternder Kern, atmende Orbitale), anhaltbar, mit Rücksicht auf »Bewegung reduzieren«
      - Bor im Mittelpunkt: dreibindig, Elektronensextett statt Oktett, daher die Gier nach einem fremden Elektronenpaar
      - "Bindungslabor: bis zu acht Atome; jedes Atom hat seine Farbe, ein bindendes Paar besteht aus je einem Elektron beider Partner"
      - "Drei Ansichten: bewegt (die gemeinsamen Elektronen laufen um beide Kerne, eine halbe Runde versetzt), statisch (das Paar liegt zwischen den Kernen, wie im Heft) und Übertragung (Ionenbindung)"
      - "Übertragung: der unedlere Partner gibt seine Außenelektronen ganz ab — sie sitzen danach in seiner Farbe auf der Schale des anderen; Ionen mit Ladung, Pfeile mit der Zahl der Elektronen, Ionenschreibweise in Klammern"
      - "Ehrliche Bilanz: Bor gibt drei Elektronen ab und hat danach zwei (Heliumkonfiguration, ein Duett) — acht bekommt es nur mit einem fremden Elektronenpaar (BF₄⁻)"
      - Freie Elektronenpaare füllen die Lücken zwischen den Bindungen gleichmäßig (die beiden des Wassers stehen symmetrisch über dem Sauerstoff)
      - Valenzstrichformel derselben Verbindung darunter; rotes Ausrufezeichen, wo das Oktett nicht aufgeht
      - 27 Vorlagen in drei Gruppen (Bor und Nachbarn, Elemente, Moleküle); Salze fehlen bewusst — die halten keine gemeinsamen Elektronenpaare
      - Elektronenbilanz je Atom mit Oktett- bzw. Duettprüfung; Klartext-Hinweis, wenn eine Kombination nicht aufgeht
  - id: strukturformeln
    name: Strukturformeln
    kann:
      - IUPAC-Name eintippen, Strukturformel entsteht beim Tippen (Parser und Layout eigener Code, Vorbild strukturformelzeichner.de)
      - Alkane, Alkene, Alkine (auch mehrfach), Ringe, Halogenalkane, Alkohole, Aldehyde, Ketone, Carbonsäuren, Ester, Amine
      - Reste als Vorsilben (2,3-Dimethylbutan) und Trivialnamen (Benzol, Essigsäure, Aceton, Glycerin)
      - Vier Darstellungen: Valenzstrich gerade (Schulform, Hauptkette waagerecht, Abzweigungen senkrecht), Valenzstrich mit 120°-Winkeln, Skelettformel, Kugel-Stab-Modell in 3D
      - 3D-Modell zum Drehen und Zoomen (three.js, lazy): Winkel nach VSEPR (Tetraeder 109,5°, Dreieck 120°, Gerade 180°), Benzol flach, Cyclohexan gewellt, PNG-Export
      - Alle H-Atome, freie Elektronenpaare; Striche enden am Schriftkasten, keine Linie laeuft durch einen Buchstaben
      - Drehen, spiegeln und als SVG speichern
      - Summenformel (Hill), molare Masse und Zahl der C-Atome; H-Atome aus der Bindigkeit gerechnet
      - Als TaskCrawler-Werkzeug mit festem Namen
  - id: wfc
    name: Wellenfunktionskollaps
    kann:
      - Wave Function Collapse (nach github.com/mxgmn/WaveFunctionCollapse, MIT) Schritt für Schritt mit Mischfarben, Anzahl der Möglichkeiten, Tempo bis »super langsam«
      - Simple Tiled Model: Landschaft (Ecken-Kacheln), Straßen & Flüsse mit Brücken, Rohre — Drehungen automatisch
      - Overlapping Model aus selbst malbarer Vorlage (Höhlen, Ziegelmauer, Wege, Inseln, Stadtplan), 2×2/3×3, Symmetrie wählbar
      - Randbedingungen: Zellen oder Rand festlegen, Widerspruch → Neustart mit neuem Zufall, unmögliche Festlegungen gemeldet
      - Reiter Textur: Textur-Synthese nach Harrison (portiert aus github.com/mxgmn/TextureSynthesis, MIT) zum Zuschauen, nahtlos, Proben aus den Gebäude-Oberflächen und Pixel-Vorlagen; erzeugt auch die Fels/Erde/Sand/Eis-Texturen der Gebäude
      - Als TaskCrawler-Werkzeug mit festem Reiter/Satz/Vorlage/Probe
  - id: algo
    name: Algorithmen-Werkstatt
    kann:
      - "Reiter Automat: vier Automaten (Kaugummi, Pfand, Fahrkarte, Kakao), Handlungskarten ordnen, Robo oder Alien Zorp führen sie wörtlich aus"
      - "Jede Falle zeigt eine Algorithmus-Eigenschaft: nicht eindeutig, nicht ausführbar, nicht endlich, falsche Reihenfolge; Automat B prüft »allgemein gültig«"
      - Notizfeld »Erst selbst aufschreiben« und Ordnungsaufgabe »Was macht der Automat?« mit Sprung ins Flussdiagramm
      - "Reiter Flussdiagramm: Editor mit Start/Ende, Ein-/Ausgabe, Anweisung, Entscheidung; Ziehen, Pfeile, ja/nein; Prüfung inkl. Endlosschleifen"
      - "Rechnender Ablauf Schritt für Schritt: eingabe T, x = 3*T + M, ausgabe r, Vergleiche in Rauten"
      - "Sieben Aufgaben: Formen zuordnen, Pfeile setzen, Fehler finden, Ablauf verfolgen, Ist das ein Algorithmus?, Geburtstagsrechnung und Lexikon selbst bauen (automatisch geprüft)"
      - Neun Beispiele (Automaten, Automat von innen, Geburtstag, Lexikon, Zähneputzen, gerade/ungerade) und freies Zeichnen
      - "Reiter Code-Abenteuer: 31 Level in acht Welten — Direktsteuerung, Planen, Drehen, Schleifen, Bedingungen, Labyrinthe, Unterprogramme, Endgegner"
      - Vorhersage-Level (Endfeld anklicken), Fehlersuche mit vorgegebenem Programm, mehrere Karten je Level, Bausteingrenzen, Sterne für kurze Programme
      - "Editor: Blockly-Blöcke im Scratch-Look über die volle Breite unter dem Spielfeld; gezeigte Programme (Vorhersage, Hinweis, Vorführen) als Puzzleteile; Programm als Flussdiagramm ansehen"
      - "Vier Themen: Bug-Jagd (Cyberpunk), Verlies-Abenteuer, Mars-Mission, Labyrinthien (Mampfi)"
      - Duell zu zweit an einem Gerät mit Zugprotokoll
      - "Sterne und Punkte überall: Bausteine, Fehlversuche und ein kleiner Zeitanteil (Zeit nur bei sichtbarer Seite); Vorführen halbiert die Punkte"
      - "Unscharfe Hilfe (Fuzzy-Logik aus Fehlversuchen, Zeit, Untätigkeit): Tipp → konkreter Hinweis → Vorführen; Hilfsmodus mit doppelter Richtzeit"
      - Radar-Anzeige beim Einsammeln und bei Sensor-Prüfungen; Bedingung »Gegner in der Nähe« (Feld vorne oder daneben)
      - "Welt 8: Viren auf Streifen kreuzen den Weg (8-2 Virenschleuse, 8-3 Datenstrom), 8-4 Jäger-Virus folgt der Figur auf dem kürzesten Weg mit halber Geschwindigkeit"
      - "Vorhersage-Level mit zweiter Frage »Was passiert am Ende?« — Programme enden auch vor dem Ziel, an der Wand oder mit Scan ins Leere"
      - Klassenübersicht für die Lehrkraft (Automaten, Aufgaben, Sterne je Level), Gäste über den Code
  - id: regeln
    name: Regel-Labor
    kann:
      - Ersetzungsregeln auf einem Raster (nach MarkovJunior), automatisch in allen vier Richtungen, mit Joker
      - Blöcke »eins«, »markov« (Vorrang) und »alle«, Schrittgrenzen, Programme aus mehreren Blöcken
      - Editor als Farbkästchen oder als Text; Zähler je Regel, Treffer-Anzeige (mögliche und eben ersetzte Stellen)
      - Lehrgang in fünf Stationen vom Zufallslauf über den Backtracker bis zum Grundriss mit Zimmern und Türen
      - Rätsel mit Regel-Limit und automatischer Prüfung (Schachbrett, Punktgitter, perfektes Labyrinth …)
      - Gleicher Zufall liefert das gleiche Bild — Ergebnisse lassen sich in der Klasse vergleichen
      - Labyrinth-Algorithmen Schritt für Schritt: Backtracker, Prim, Kruskal, Wilson; Löser Tiefensuche, Breitensuche, A* mit sichtbarem Stapel/Schlange/offener Liste und Vergleichstabelle; Rundwege per »Wände einreißen«
      - Beispielgalerie mit Vorschaubildern: Labyrinth, Blumen, Höhle (aus MarkovJunior), Platine, Verlies, Game of Life — alle im Editor veränderbar
      - 34 weitere MarkovJunior-Beispiele per Auswahlliste, automatisch übertragen (scripts/mj-beispiele.py), mit Link aufs Original; Quellen: github.com/mxgmn/MarkovJunior, instagram.com/index.opensource
      - Tempo von »super langsam« bis »sofort«; Programm-Schrittgrenze »grenze N«
      - Weitere Bausteine: Symmetrie je Block (gedreht & gespiegelt / nur gespiegelt / fest), gleichrangige Regeln in markov, Chance je Treffer, Pfad (kürzester Weg, mit Abstand), Nachbarn (Zellautomat)
      - Gebäude aus einer Wachstumsregel (WBB=WAW): Stockwerke in 3D zum Durchlaufen, daneben der Grundriss als Raster; Grundlage der TaskCrawler-Gebäudeansicht
      - Ganzes Haus als drehbares Modell (alle Stockwerke, Treppen, Stützen, Sockel) in 17 Stilen (Klassisch, Beton, Glas & Neon, Gartenpalast, Verlies, Burg, Holzhütte, Eispalast, Wüstentempel, Raumstation, Lavahöhle, Steinzeithöhle, Antiker Tempel, Mittelalter, Gotik, Viktorianisch, Retro)
  - id: verkehr
    name: GTA – Ganztagsaufmerksamkeit im Verkehr – zu Fuß
    kann:
      - Echte Karte um die Schule (OpenStreetMap, 750 m)
      - Zu Fuß laufen in GTA-artiger Draufsicht (Pfeile/WASD)
      - Anzeige des Untergrunds (Gehweg, Radweg, Fahrbahn, Gleis)
