      - "Spiel Bauhof mit Levels und Sternen: Gehege bauen (Rechteck aufziehen, Zaun = Umfang reicht, Platz = Fläche genügt, Felsen/Wasser draußen; drei Sterne für das größtmögliche Gehege) und Wand streichen (Wand ohne Fenster und Tür mit möglichst wenigen Rechteck-Strichen, Summe der Teilflächen als Rechnung)"
