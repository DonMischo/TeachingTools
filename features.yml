# TT - Teaching Tools: Feature-Übersicht (maschinenlesbar)
# Die ausführliche Fassung steht in README.md. Freigabe-Defaults je Werkzeug
# kommen aus api/tool_catalog.py, dort ist die verbindliche Quelle.

projekt:
  name: TT - Teaching Tools
  beschreibung: >-
    Schulweites Punktesystem und Unterrichtsplattform. Lehrkräfte vergeben
    Punkte an Klassen, die Klassen sammeln in Häusern für den Hauspokal. Dazu
    Aktivitäten, Simulationen, Unterrichtswerkzeuge, Klassenverwaltung, Kalender
    und Startseiten-Slideshow, alles auf dem eigenen Schulserver.
  stack:
    frontend: [Next.js 16, React 19, Tailwind CSS 4, TanStack Query, KaTeX, three.js]
    backend: [FastAPI, SQLAlchemy, WebSockets]
    datenbank: PostgreSQL 17
    betrieb: Docker Compose (postgres, api, frontend), LibreOffice für PDF-Exporte
  dienste:
    frontend: http://localhost:1339
    api: http://localhost:8000
    postgres: localhost:5435

# Fähigkeiten je Werkzeug: use = Öffnen/Beitreten, host = Hosten,
# create = Erstellen, upload = Hochladen. Werte: Default für lehrkraft / schueler.

kern:
  - id: hauspokal
    name: Hauspokal (Startseite)
    kann:
      - Live-Diagramm aller Häuser mit animierten WebGL-Balken
      - Häuser zählen die Punkte ihrer Klassen zusammen, automatische Aktualisierung
  - id: punkte
    name: Punkte vergeben
    kann:
      - Schnellauswahl (+5 bis +100) oder freie Punktzahl mit Grund
      - Punkte-Leitfaden mit Richtwerten von 5 bis 500
      - Punkte an Klassen, Kurse, Wahlpflicht- und A/B-Gruppen
      - Punkte-Log je Klasse, Löschen nur für Admins
      - Klassen-Spitznamen
      - Automatische Punkte aus Caputh, Bingo, TaskCrawler und Maus-Führerschein
      - Kurs-/WPF-Sitzungen bewerten jede beteiligte Klasse nach eigener Quote
  - id: playhub
    name: Mitmachen per Code
    kann:
      - "/play: ein Code für alle Werkzeuge, Weiterleitung zum richtigen Werkzeug"
      - QR-Code je Sitzung
      - Befristeter Gastzugang ohne Konto, gilt nur für eine Sitzung
      - Gastzugang schließt nach dem eingestellten Fenster von selbst
      - Sitzungen für Klasse, A/B-Hälfte, Kurs oder WPF-Gruppe
      - Lehrkraft spielt selbst mit (alle Aktivitäten), setzt nach dem Dashboard fort, unsichtbar für die Klasse und ohne Hauspunkte

aktivitaeten:
  - id: caputh
    name: Caputh
    typ: Quiz
    faehigkeiten: {use: [true, true], host: [true, false], upload: [true, true]}
    kann:
      - Modi Klassisch, TÜ, Test, Aufgabe, Wettbewerb, Benutzerdefiniert
      - Live-Sitzung mit Host-Screen, Beitritt per Code, Team-Modus
      - Bilder in Fragen, eingebettete Lückentexte und Zeitstrahlen
      - Gruppenauswertung
      - Import als .json/.zip, Vorlage
      - Bearbeiten per Formular (alle Fragetypen inkl. Zeitstrahl, Bilder direkt hochladen), frühere Auswertungen bleiben gültig
  - id: bingo
    name: Bingo
    faehigkeiten: {use: [true, true], host: [true, false], create: [true, true]}
    kann:
      - Rastergröße und Caller/Antwort-Paare frei wählbar
      - Eigene Karte für jede Person
      - JSON-Import, Vorlage, Prompt für externe KI
      - Sets bearbeiten
      - Zurücksetzen oder neu starten (alle Karten neu gemischt)
      - Auswertung je Karte: Treffer gegen auf der eigenen Karte Gerufenes
  - id: exitgame
    name: TaskCrawler
    faehigkeiten: {use: [true, true], host: [true, false], upload: [true, true]}
    kann:
      - Spielen im eigenen Tempo, Fortschritt live für die Lehrkraft
      - Codeschnipsel aus Aufgaben öffnen die Tür
      - "Krabbler bei falscher Antwort: Käfer sperren 10–45 s Maus und Tastatur, ab drei Fehlern pro Minute mit Mutmacher und Fehlerzahl, darunter der letzte Erklärtext zum Nachlesen, ohne Erklärung davor der Text der Station selbst (auch Challenge Normal, Bingo, Lückentext)"
      - Erklärtexte und Aufgaben mit 🔊 vorlesen (Frage, Antworten, Beispiel, Hinweise)
      - Werkzeuge (Simulationen) an Aufgaben und auch an Erklärung/Beispiel zum Ausprobieren
      - Serverseitige Fuzzy-Anpassung der Schwierigkeit (Hinweise, Zeitlimits, leichtere Aufgaben)
      - Aufgaben aus Generatoren, eingebettete Lückentexte und Zeitstrahlen
      - Import als .json/.zip, Vorlage mit allen Bausteinen
      - Bearbeiten per Formular: Folien, Aufgaben, Codeschnipsel, Hinweise, Objekte, Werkzeuge, Bilder direkt hochladen
      - Gebäude-Ansicht: isometrisches Haus (three.js), Abschnitt = Stockwerk, Folie = Zimmer, Tür = Treppenhaus; Grundriss wächst aus den Regeln des Regel-Labors, gleicher Code = gleiches Haus
      - Drei 2.5D-Arten: Gebäude (Treppen hinauf), Verlies (Ebenen hinab, nur die aktuelle sichtbar, Fackellicht, animierte Quaternius-Monster und -Wächter, die besiegt am Boden liegen) und Ebene (Abschnitte nebeneinander, verschlossene Türen); jederzeit zurück; Zifferntasten 1–9/0 laufen zu Zimmer bzw. Treppe
      - Zwei Vorlagen: schlank (Folien-Bausteine) und interaktiv (spielbares Verlies mit Stationen, Monstern, Bossen, Werkzeugen, »gebaeude«-Startansicht)
      - Spielfigur wählbar: sieben Klassen (Normal, Krieger, Magier, Priester, Rapper, Rocker, Metalhead), männlich/weiblich, vier Hauttöne, oder die 30 Avatar-Tiere als 3D-Figuren im Pokémon/Palworld-Stil (Chibi-Proportionen, Anime-Gesichter, Toon-Look mit Umriss; in Blender per Skript gebaut, scripts/avatare); alle mit Skelett und Bewegungen (Idle, Gehen, Rennen, Angriff, Treffer, Jubel, Tod; Menschen aus Quaternius' Universal Animation Library, CC0, Tiere je Körperbau selbst animiert); drehende Vorschau mit Jubel bei neuer Wahl; im Gebäude läuft die Figur, im Bosskampf greift sie an, zuckt bei Gegentreffern und jubelt beim Sieg; gespeichert auf dem Gerät (auch im Regel-Labor); TaskCrawler fragt beim ersten Betreten, Gäste bekommen ihr Beitritts-Tier
      - Textfassung (📄 Text) immer neben der 2.5D-Ansicht wählbar
      - Ergebnissicherung: Merksatz je Folie (»ergebnissicherung«), am Ende als gestaltetes PDF nach Abschnitten mit Namen und Datum; kommt erst mit /finish (kann Lösungen enthalten); die Lehrkraft lädt dasselbe PDF im Live-Dashboard
      - 39 Stationsobjekte inkl. Medien durch die Zeit (neu: Lagerfeuer, Quipu, Orakelknochen, Maya-Faltbuch, Tastenhandy, Röhren-PC) (Höhlenmalerei bis KI-Rechenzentrum); das Objekt spricht (Telefon klingelt, Radio sendet …); ohne »station« reihum statt Tafel/Schreibtisch
      - Beispiel »Zeitreise der Medien«: sechs Epochen (Steinzeit bis Photoshop/Deepfakes/ChatGPT) mit Epochen-Stil und passenden Geräten; freiwillige 🌍-Aufgaben am Globus ohne Codeschnipsel (China, Korea, Inka, Maya, Kuba/Lateinamerika, Japan, Kenia)
      - "Interaktive Vorlage mit Nachschlageliste »_katalog«: alle Ansichten, Stile, Objekte und Werkzeuge samt config-Parametern (eine Quelle mit der Upload-Prüfung: api/exitgame_katalog.py); beim Herunterladen auf die Werkzeuge gewählter Fächer kürzbar (?werkzeuge=)"
      - "Vorlagen bitten die KI, Anleitung und Katalog nicht zurückzuschicken; Upload-Fehler lassen sich als fertiger Reparatur-Prompt »Für die KI kopieren«"
      - "17 Stile (Klassisch, Beton, Glas & Neon, Gartenpalast, Verlies, Burg, Holzhütte, Eispalast, Wüstentempel, Raumstation, Lavahöhle, Steinzeithöhle, Antiker Tempel, Mittelalter, Gotik, Viktorianisch, Retro), wahlweise je Abschnitt ein eigener (\"gebaeude\": {\"stile\": […]}), z. B. Zeitreise der Medien von der Steinzeit bis heute; Oberflächen je Stil als gemalte Muster (Fels, Mauerwerk, Dielen, Parkett, Marmor, Fachwerk, Tapete, Teppich, Metall, Eis …), Höhlen organisch aus Felsbrocken mit Tropfsteinen, Verzierungen (Säulen, Turmspitzen, Zinnen, Eiskristalle); Lavahöhle mit glühenden Rissen (leuchten auch im dunklen Verlies); legt das Spiel Ansicht/Stil fest, gibt es keine Auswahl — sonst wählen die Schüler"
      - Stationen anklicken; 13 Objekte in den Zimmern (Computer, Kuckucksuhr, Globus, Tresor …), automatisch passend oder per "station"
      - "Werkzeug-Stationen: eine Aufgabe öffnet eine Simulation mit fester Vorgabe (\"sim\": {tool, config}) — Gleichungswaage, Funktionen, Vierecke, Rechenregeln mit genau einer Aufgabe, alle übrigen auf einen Reiter festgelegt; Antwort wird weiter serverseitig geprüft"
  - id: challenge
    name: Challenge
    faehigkeiten: {use: [true, true], host: [true, false], upload: [true, true]}
    kann:
      - "Leistungsüberprüfung als Minispiel: Fakten per Klick oder Ziehen der passenden Challenge zuordnen, kein Multiple Choice"
      - Ein Satzformat für alle Spielarten (facts, challenges, decoys, Etappen), Import als .json/.zip mit Bildern, Vorlage, Bearbeiten per Formular oder JSON
      - Kombos (mehrere Fakten zusammen), falsche Fakten schwächen den Treffer (Malus), drei Fehlversuche führen zurück zur Karte mit Wissen zum Nachlesen
      - Jede Frage zeigt in allen Spielarten, wie viele Fakten die Antwort braucht (🃏 je Fakt)
      - Spielart jederzeit wechselbar (auch der Gerichtssaal, im Bosskampf über »Wechseln«); die aktuelle Etappe beginnt dann von vorn, geschaffte Etappen und alle Antworten bleiben
      - "Bosskampf: Lebensbalken des Helden statt Herzen, zwei Heiltränke je Etappe in der Tasche (je ein Leben zurück)"
      - "Gerichtssaal als Bild: Richter mit Hammer am Pult, Zeuge im Zeugenstand (schwitzt, zittert, bricht zusammen), Geschworene reagieren, vorn Verteidigung und Anklage"
      - Vier Stufen mit eigenen Texten und Fragen je Stufe (levels), Stufe wechselt per Fuzzy-Anpassung; Tipps nur auf Stufe 1
      - "Wertung: jede Antwort zählt, Wiederholungen heben die Güte, 100 % nur ohne Fehler im ersten Anlauf; Spiel- und Wissenswertung getrennt"
      - Auswertung je Person (Lesetempo, geraten, Kombos, gewählte Ablenker), CSV, Hauspunkte als Klassenmittel (bis 100 je Person)
      - "Zehn Spielarten auf denselben Daten, von der Lehrkraft freigegeben, von Schülern gewählt: Normal, Kartenspiel (Deck bauen, Ablenker im Deck werden berichtet), Bosskampf mit Skins (Drache, Rap-Battle, Prinzessin, Einhorn), Jump'n'Run (Schlüssel und Türen), Turmverteidigung, Detektiv, Alchemie, Brückenbau, Gerichtssaal (falsche Behauptungen »claims« widerlegen), Glücksrad (Rätselwand mit dem Etappentitel, richtige Antworten decken Buchstaben auf, Fehler füllen den Galgen)"
      - Pixelgrafik mit Themes (Wald, Ninja, Verlies, Antike, Weltraum) aus freien Kachelsätzen (CC0), Sammelphase je Spiel überspringbar, Bühnen passen aufs Handy
      - "Drachenkampf: Sammelkarte als Verlies aus den Markov-Regeln des Regel-Labors (wie der TaskCrawler-Grundriss), Figur läuft per Pfeiltasten oder Klick, Truhen öffnen, Mini-Monster im animierten Klicker-Kampf; jeder Kampf beginnt im Pokémon-Stil (Blitz, Wischblende, Textbox), bei reduzierter Bewegung ohne Intro"
      - "Bosskampf als 3D-Arena (mit WebGL, sonst Pixelbühne): eigener Avatar gegen animierten 3D-Boss aus Quaternius »Ultimate Monsters« (CC0: Drache, Tentakel-Blob, Dämon, Ork; mit Angriffs-, Treffer- und Todesanimation); Gegner-Liste mit mindestens einem Monster je Element; Lebensbalken mit weichem Absinken, Geisterbalken (zeigt den Verlust kurz an, sammelt schnelle Treffer), Trefferblitz mit Rütteln und rotem Pulsieren bei wenig Leben (auch Helden-KP und Kartenspiel); Treffer lösen das Element des Helden aus – nach der Klasse des Avatars (Krieger Klingen, Magier Arkan, Priester Licht, Rapper und Rocker Schall), sonst nach dem Skin (Held Eis, Rapper Blitz, Prinzessin Pflanzen, Einhorn Fee) –, Fehlversuche den Gegenzug des Bosses mit dem Element seines Zugs (z. B. Feueratem, Schleimwelle, Schattenbiss); achtzehn Elemente: Eis, Feuer, Erde, Blitz, Pflanzen, Dunkelheit, Gift, Blut, Schatten, Fee, Wind, Schall, Licht, Klingen, Arkan, Wasser (Welle, Wasserblase, Geysir), Sterne (Nachthimmel, Galaxie, Sternschnuppen, Supernova) und Heilung (wirkt auf den Zaubernden selbst)"
      - "Jump'n'Run: jede Etappe bei jedem Besuch eine neue Karte in sechs Stilen (Treppe, Tal, Türme, Inseln, Höhle, Zickzack), Abgründe, bewegliche Plattformen, Gegner zum Draufspringen, Edelsteine an schwierigen Stellen; Schlüssel und Türen immer sicher erreichbar"
      - "Spielmechaniken nach Genre-Vorbildern: Kartenspiel als Deckbuilder (Booster mit fünf verdeckten Karten, Nachziehstapel, Hand, Ablage, Energie, Absichten der Gegner, Etappenkarte), Bosskampf mit Kampfmenü und Levelaufstieg, Jump'n'Run mit Sprungpuffer, variabler Sprunghöhe und Pogostock, Turmverteidigung mit Wellen, Gold und Türmen auf dem Labyrinth-Pfad, Detektiv mit Tatort-Haus, Verhören und Pinnwand, Alchemie als Trankladen mit Heckenlabyrinth und Kundschaft, Brückenbau mit Testfahrt über alle belegten Segmente (bricht am ersten falschen), Gerichtssaal als Kreuzverhör"
      - Karten aller Draufsicht-Spiele aus den Markov-Regeln des Regel-Labors (Verlies, Haus, Hecken- und Waldlabyrinth) mit Minikarte; Spielpunkte jeder Spielart in der Bestenliste
      - "Etappen: je Etappe höchstens 12 Faktenkarten (alle nötigen plus Ablenker, vom Server gewählt), Reihenfolge der Etappen wahlweise gemischt (Sitzung und Boss-Folie), Sieg erst nach allen Etappen; vor jedem Kampf wird das Deck bzw. die Ausrüstung gewählt (im Bosskampf ist alles vorgewählt, man wählt ab; »Flucht« führt zurück zur Ausrüstung, nach der Rückkehr zur Karte geht es ohne neues Sammeln direkt dorthin)"
      - "Sitzung je Klasse bzw. Kurs/WPF/A-B-Gruppe (eigener Code): nur diese Klasse kommt herein, Gäste zählen für sie, Hauspunkte nur für sie; alte Codes ohne Klasse bleiben offen für alle"
      - "Normal: Fragen und Fakten in getrennten Rahmen, gelöste Fragen grün, falsch beantwortete rot"
      - "Fragen heben sich in allen Spielarten ab (Akzentbalken, Symbol, fett); Gegner mit Lebensbalken (Bosskampf, Kartenspiel) trinken nach unvollständigen Antworten einen kleinen, nach falschen einen großen Heiltrank (nur Anzeige)"
      - "Gäste behalten ihren Spielstand nach Namen: wer im selben Browser mit demselben Namen wieder beitritt, spielt weiter (Challenge und TaskCrawler)"
      - "Drachenkampf: Mini-Monster schlagen zurück (Lebenspunkte, Angriffsankündigung, Parieren, bei Niederlage zurück auf die Karte); Jump'n'Run: erst die Schlüsselzone, dann führt jede Tür (am Tor mit E öffnen) in einen neuen Abschnitt; Welten wachsen nach oben und unten mit senkrechter Kamera; durch Plattformen fallen lassen (↓), Sprung in der Luft, Rennen (Shift) für Weitsprung"
      - "Beim Sammeln Hinweise/Teile wegwerfen (Papierkorb mit Zurückholen, nur lokal, nicht gewertet); Kartenspiel behält die Hand, Abwerfen und Mischen; Brückenbau als eine Brücke in Segmenten (höchstens 10, sonst bis zu 3 Brücken); Turmverteidigung mit stärker werdenden Wellen, Zeitschleife beim Antworten und Schwächung durch gefallene Anführer; Alchemie mit der WebGL-Flüssigkeit der Häuseranzeige und Vektorfiguren"
      - Edelsteine gespeichert (bester Wert je Etappe), Bestenliste je Sitzung im Spiel, auf der Karte und am Ende; eigene Spalte in der Übersicht und im CSV, zählt nicht zur Wertung
      - Startstufe je Schüler, Stufe laufender Spieler änderbar; DDA-Kalibrierung je Klasse als Vorschlag aus Lesetempo und Antwortzeiten (nur Summen, bestätigen oder zurücksetzen)
      - Als Boss-Folie im TaskCrawler (Zwischen- und Endboss), Sieg gibt den Codeschnipsel frei; Beispiele in beiden Vorlagen
  - id: lueckentext
    name: Lückentext
    faehigkeiten: {use: [true, true], host: [true, false], create: [true, true], upload: [true, true]}
    kann:
      - Lücken als Wortbank, Freitext oder Multiple Choice (Zieh- und Schreiblücken sehen unterschiedlich aus)
      - Live-Runde mit Rangliste, Einzelübung, Korrekturmodus
      - PDF-Export leer oder ausgefüllt
      - Einbettbar in Caputh und TaskCrawler
  - id: zeitstrahl
    name: Zeitstrahl
    faehigkeiten: {use: [true, true], create: [true, true], upload: [true, true]}
    kann:
      - Zeitleisten mit parallelen Spuren und Zahlenstrahlen
      - Anzeigen, einsortieren, Fehler finden
      - JSON-Import, Vorlage, Beispiel-Zeitleisten (u. a. Entdeckungen der Geowissenschaften)
  - id: karten
    name: Karten
    faehigkeiten: {use: [true, true], host: [true, false], create: [true, false], upload: [true, false]}
    kann:
      - Selbst gehostete Karten (MapLibre, keine Anfragen nach außen)
      - Kartennetz Equal Earth (Standard), Robinson, Winkel-Tripel (beide über PROJ), Mercator oder Globus im ☰-Menü, je Kartensatz gespeichert; schwarz-weiße Maßstabsleiste, Quellen unter der Karte
      - Kinderatlas »Robinson Crusoe« - bunte Länder, wenig Einzelheiten, Tiere und Pflanzen nach Wahl als Illustration (Openclipart) oder Avatar-Kachel (Robinson-Netz)
      - Regionen Deutschland, Thüringen, Europa, Welt, Kontinente; Kartenarten politisch, topographisch, stumm, Wirtschaft, Physisch
      - Ebenen aus offenen Daten (BKG, BGR, Natural Earth, OPSD, CORINE, Bird PB2002, Köppen-Geiger) mit Quellenangabe auf der Karte
      - Deutschland - Bundes-, Landes- und Kreisstraßen, Bodennutzung einfach oder genau (CORINE), Bodenschätze (BGR-Lagerstätten und Abbaustellen)
      - Europa genauer - BIP pro Kopf und Bevölkerungsdichte je NUTS-2-Region, EU/Eurozone/EFTA, Kraftwerke, Verkehr
      - USA-Wirtschaft - Landwirtschaft und Viehhaltung je Bundesstaat, Manufacturing Belt und Sun Belt, Industriestandorte (schematisch)
      - Atlas-Signaturen für Kraftwerke, Bergbau, Flug- und Seehäfen, Industrie und Sonderkulturen (Karte und Legende)
      - Stadtmodelle Berlin, Paris, New York - Zentrum, Innenstadt, Stadtrand aus amtlichen Bezirken
      - Alle Siedlungen Deutschlands mit Größenklassen-Filter in der Legende, Ortssuche
      - Meeresboden mit Tiefenstufen und Schummerung, Tiefseegräben und Rücken (quizfähig)
      - Meeresströmungen und Windsysteme (ITC, Druckgürtel, Monsun) animiert, einzeln anklickbar, Jahresverlauf per Monatsregler, Partikelfluss (Wind leuchtend in Gürtelfarben, ITC als Band)
      - Kartensätze: Objekte auswählen, nummerieren (1 2 3, a b c, A B C, I II III), auf dem Server speichern und teilen; der volle Datensatz bleibt unverändert
      - Nummern, die aufeinanderliegen (Berlin als Stadt und Land), rücken auseinander; Landesnamen weichen Stadtnamen aus
      - Arbeitsblatt als PDF, DOCX, ODT oder LaTeX (Karte füllt Seite 1, Querformat-Karten gedreht auf hochkantem Blatt; Tabellen zweispaltig, ein Thema je Spalte; leer oder mit Lösung; PDF in Atkinson Hyperlegible)
      - Seitenformat A4 hoch/quer - Karte im Verhältnis der Seite, füllt Seite 1; Knopf zum Einpassen der Region
      - Eigene Ebenen (GeoJSON, KML, KMZ, GPX) nur für Lehrkräfte
      - JSON-Vorlage mit »aktiv« je Objekt zum Filtern (auch per KI) und wieder hochladen
      - Kartenquiz per Code/QR (benennen oder finden), Prüfung auf dem Server, Hauspunkte je Klasse
      - Ganzes Kartentool per Code/QR zum Erkunden (Ebenen, Kartenart, Kartennetz, Ortssuche) - auch für Gäste, ohne Kartensätze, Upload und Export
      - Erfolge je Kartensatz in neun Arten (Anteil, fehlerfrei, bestimmte Objekte, Serie, auf Zeit, benennen und finden, Fehler aufgeholt, an mehreren Tagen, alle)
      - Lernhelfer »Üben« – Fuzzy-Regeln wählen, was am wenigsten sitzt; unsicher → Auswahl mit Ablenkern (frühere Verwechslungen, Nachbarn, ähnliche Namen), sicher → freie Eingabe; Lernstand über Sitzungen hinweg
      - Üben ohne Code - eingeloggte Schüler üben geteilte Kartensätze direkt, mit Lern-Erfolgen
      - Automatisch weiter - nächste Übungsaufgabe ohne Klick (pro Browser gemerkt)
      - Einbettbar in Caputh und TaskCrawler
  - id: uebung
    name: Übung
    kann:
      - Generierte Mathe-Aufgaben Kl. 1–7 (Thüringer Lehrplan)
      - Schwierigkeit steigt nach drei richtigen, sinkt nach zwei falschen
      - Prüfung auf dem Server, Fortschritt je Thema

# Übersicht /simulationen: Fächer je Simulation (mehrere möglich), Filter nach
# einem oder mehreren Fächern; Admins ändern Fächer schulweit oder legen eigene
# an (school_settings.tool_faecher, Voreinstellungen in frontend/src/lib/faecher.ts).
  - id: elemon
    name: Elemon
    faehigkeiten: {use: [true, true]}
    kann:
      - Monster-Sammelspiel aus Klikk als eigenes Spiel, Spielzeit nach der echten Uhr
      - Trainer-Name aus Vorschlägen (kein Freitext), Käfig-Fang, Trainer, Arenen, Orden
      - Duelle mit Code — gezielt (andere Seite nimmt an oder lehnt ab) oder offen an alle; drei Minuten Pause nach jeder Herausforderung
      - Eigener QR-Code je Spieler·in zum Herausfordern, Scanner mit Kamera oder Abtippen
      - Druckbare QR-Karten mit wilden Elemon zum Fangen (Lehrkraft)
      - Item-Karten mit Multiplikator (Trank, Käfig, Goldkäfig, Beleber), je Karte eine Sperre für die ganze Sitzung, bis zu 10 Karten je Item
simulationen:
  - id: gleichungswaage
    name: Gleichungswaage
    kann:
      - Äquivalenzumformungen in den Modi Zahlen, Variablen und Chemie
      - Modus Rechnen (Grundschule) — Äpfel, Sterne, Autos … zusammenlegen und wegnehmen, im Drehpunkt <, = oder >; Spielarten frei legen, gerade machen, Zeichen raten
      - Sieben Stufen, Klammern, Brüche, eigene Gleichungen
      - Teile von Hand auf nur eine Schale ziehen (Waage kippt, Rechenweg zeigt ≠), Plus- und Minus-Teil nebeneinander
      - Motive Streichhölzer/Schachtel, Gummibärchen/Tüte, Murmeln/Säckchen, Münzen/Geldbeutel; stehende Streichhölzer; Minus abgebrannt, angebissen, zerbrochen bzw. schwarz
      - Formeln umstellen (F = m·a, p = F/A)
      - Reaktionsgleichungen ausgleichen mit Ionen, Kernteilchen, Oxidationszahlen, Oktett-Hinweis
      - Rechenweg wie im Heft, LaTeX-Eingabe
  - id: abacus
    name: Abakus
    kann:
      - Rechenrahmen, Modus »Alle gleich« oder »Stellenwert«
  - id: bildformate
    name: Bildformate
    kann:
      - PBM, PGM und PPM als Text bearbeiten, Bild in Echtzeit
      - Ins Bild klicken schreibt den Wert zurück in den Text
  - id: vierecke
    name: Vierecke
    kann:
      - Sechs Vierecke mit Formeln, Rechenweg und Eigenschaften
